name: selfhost

# The self-hosted build on plain Postgres 16, no Supabase-only features: build the image, apply
# every migration, seed a synthetic 50-door PMC, post one month of rent, export a statement and
# the ledger, check health, then start the API, ask its health endpoint and load the portal;
# then bring up the demo (compose.demo.yaml) and ask it the same, and the install for a company
# (compose.selfhost.yaml): setup, and its daily backup restored. Runs nightly, by hand, and on
# PRs that touch the Dockerfile, a compose file, .env.example, requirements, migrations, the
# backup scripts or the app code in src/ (db.yml calls it after its own job, so PR CI stays
# within 8 jobs at a time).
on:
  workflow_call:
  schedule:
    - cron: "17 5 * * *" # nightly 05:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  selfhost:
    name: selfhost
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the image
        run: docker compose build
      # Syft lists what is in the image (an SBOM, kept as an artifact); Grype fails on a known
      # high or critical vulnerability that has a fix. Both are built from their pinned source
      # versions (Apache-2.0), which Go checks against its checksum database.
      - name: What the image holds (Syft) and its fixable vulnerabilities (Grype)
        env:
          GOTOOLCHAIN: auto
        run: |
          go install github.com/anchore/syft/cmd/syft@v1.54.1
          go install github.com/anchore/grype/cmd/grype@v0.120.1
          "$(go env GOPATH)/bin/syft" occupella-pms:local -o cyclonedx-json="$RUNNER_TEMP/sbom.json"
          "$(go env GOPATH)/bin/grype" "sbom:$RUNNER_TEMP/sbom.json" --only-fixed --fail-on high
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: sbom
          path: ${{ runner.temp }}/sbom.json
          retention-days: 14
      - name: Start plain Postgres 16
        run: docker compose up -d --wait db
      - name: Apply every migration
        run: docker compose run --rm migrate
      - name: Seed 50 doors, post a month of rent, export, check health
        run: docker compose run --rm smoke
      - name: Start the API, ask its health endpoint and load the portal
        run: |
          docker compose up -d --wait app
          docker compose exec -T app python -c \
            "import json, urllib.request as u; print(json.load(u.urlopen('http://127.0.0.1:8000/health')))"
          docker compose exec -T app python -c \
            "import urllib.request as u; page = u.urlopen('http://127.0.0.1:8000/').read(); assert b'id=\"root\"' in page, page; print('portal served')"
      # The demo on one machine (compose.demo.yaml, README "Try the demo"): one command brings it
      # up on its own Postgres, prints the sign-in links and publishes the PMS on 127.0.0.1:8100;
      # brought up again, it adds no second demo.
      - name: The demo comes up in one command, on its own port, once
        run: |
          docker compose -f compose.demo.yaml up -d --wait app
          docker compose -f compose.demo.yaml logs demo | grep "Sign in as the manager"
          curl -fsS http://127.0.0.1:8100/health
          curl -fsS http://127.0.0.1:8100/ | grep -q 'id="root"' && echo "portal served"
          docker compose -f compose.demo.yaml up -d --wait app
          docker compose -f compose.demo.yaml logs demo | grep "no demo was added"
      - name: The install guide's setup starts from .env.example, and setup makes a company
        # docs/install.md, steps 2, 3 and 5, with test values: a password made here, plain http on
        # localhost (so the cookie isn't held to HTTPS), no email or payments.
        run: |
          sed -e "s/^PMS_DB_PASSWORD=$/PMS_DB_PASSWORD=$(openssl rand -hex 24)/" \
              -e "s/^PMS_APP_DB_PASSWORD=$/PMS_APP_DB_PASSWORD=$(openssl rand -hex 24)/" \
              -e "s|^PMS_PUBLIC_URL=.*|PMS_PUBLIC_URL=http://localhost:8000|" \
              -e "s|^PMS_COOKIE_SECURE=true|PMS_COOKIE_SECURE=false|" .env.example > .env
          docker compose -f compose.selfhost.yaml up -d --wait app
          docker compose -f compose.selfhost.yaml ps
          curl -fsS http://127.0.0.1:8000/health
          curl -fsS http://127.0.0.1:8000/ | grep -q 'id="root"' && echo "portal served"
          # The app connects as pms_app, never the superuser (src/pms/app_login.py).
          app_logins() {
            docker compose -f compose.selfhost.yaml exec -T db psql -U postgres -d pms -Atc \
              "SELECT count(*) FROM pg_stat_activity WHERE client_addr IS NOT NULL AND usename = '$1'"
          }
          [ "$(app_logins pms_app)" -ge 1 ] && [ "$(app_logins postgres)" -eq 0 ] && echo "app logs in as pms_app"
          docker compose -f compose.selfhost.yaml exec -T app \
            python -m pms.admin setup "Synthetic Install Co" "First Admin" first.admin@example.com \
            > "$RUNNER_TEMP/setup.out"
          grep -c "^company \|^admin " "$RUNNER_TEMP/setup.out" | grep -qx 2
          grep -q "^http://localhost:8000/invite#" "$RUNNER_TEMP/setup.out" && echo "invite made"
      - name: The install backs itself up, and the backup comes back whole
        # compose.selfhost.yaml's backup service dumps the database at start (there is no dump of
        # today yet) into ./backups; that dump restores into a new database with
        # scripts/backup.sh restore, which checks the ledger ties out (docs/backup.md).
        run: |
          docker compose -f compose.selfhost.yaml up -d backup
          for _ in $(seq 1 60); do
            docker compose -f compose.selfhost.yaml exec -T backup sh -c 'ls /backups/pms-*.dump' \
              && break
            sleep 2
          done
          docker compose -f compose.selfhost.yaml logs backup
          docker compose -f compose.selfhost.yaml exec -T db createdb -U postgres pms_restored
          docker compose -f compose.selfhost.yaml exec -T -e PGDATABASE=pms_restored backup \
            bash -c '/scripts/backup.sh restore "$(ls /backups/pms-*.dump | tail -n 1)"' \
            2>&1 | tee "$RUNNER_TEMP/restore.out"
          grep -q "the ledger ties out" "$RUNNER_TEMP/restore.out"
          test "$(docker compose -f compose.selfhost.yaml exec -T backup bash /scripts/backup-daily.sh next)" -gt 0
          docker compose -f compose.selfhost.yaml exec -T backup bash /scripts/backup-daily.sh healthy
      - name: Logs
        if: failure()
        run: |
          docker compose logs
          docker compose -f compose.demo.yaml logs
          docker compose -f compose.selfhost.yaml logs
      - name: Clean up
        if: always()
        run: |
          docker compose down -v
          docker compose -f compose.demo.yaml down -v
          docker compose -f compose.selfhost.yaml down -v || true
          rm -f .env
