name: selfhost

# The self-hosted build on plain Postgres 16, no Supabase-only features: build the image, apply
# every migration, seed a synthetic 50-door PMC, post one month of rent, export a statement and
# the ledger, check health, then start the API, ask its health endpoint and load the portal. Runs nightly, by hand, and on PRs that touch the Dockerfile, compose
# file, requirements, migrations or the app code in src/ (db.yml calls it after its own job, so
# PR CI stays within 8 jobs at a time).
on:
  workflow_call:
  schedule:
    - cron: "17 5 * * *" # nightly 05:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  selfhost:
    name: selfhost
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the image
        run: docker compose build
      # Syft lists what is in the image (an SBOM, kept as an artifact); Grype fails on a known
      # high or critical vulnerability that has a fix. Both are built from their pinned source
      # versions (Apache-2.0), which Go checks against its checksum database.
      - name: What the image holds (Syft) and its fixable vulnerabilities (Grype)
        env:
          GOTOOLCHAIN: auto
        run: |
          go install github.com/anchore/syft/cmd/syft@v1.54.1
          go install github.com/anchore/grype/cmd/grype@v0.120.1
          "$(go env GOPATH)/bin/syft" occupella-pms:local -o cyclonedx-json="$RUNNER_TEMP/sbom.json"
          "$(go env GOPATH)/bin/grype" "sbom:$RUNNER_TEMP/sbom.json" --only-fixed --fail-on high
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: sbom
          path: ${{ runner.temp }}/sbom.json
          retention-days: 14
      - name: Start plain Postgres 16
        run: docker compose up -d --wait db
      - name: Apply every migration
        run: docker compose run --rm migrate
      - name: Seed 50 doors, post a month of rent, export, check health
        run: docker compose run --rm smoke
      - name: Start the API, ask its health endpoint and load the portal
        run: |
          docker compose up -d --wait app
          docker compose exec -T app python -c \
            "import json, urllib.request as u; print(json.load(u.urlopen('http://127.0.0.1:8000/health')))"
          docker compose exec -T app python -c \
            "import urllib.request as u; page = u.urlopen('http://127.0.0.1:8000/').read(); assert b'id=\"root\"' in page, page; print('portal served')"
      - name: Logs
        if: failure()
        run: docker compose logs
      - name: Clean up
        if: always()
        run: docker compose down -v
