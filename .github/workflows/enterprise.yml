name: enterprise

# A company of 20,000 units brought over through the switching tool with five years of history,
# its nightly run, its reports, fifty staff at work on it over HTTP for an hour with the nightly
# run under them, then backed up and restored (tools/enterprise.py; synthetic data only). Each
# step has a ceiling in ci/thresholds.toml ([enterprise]); the books must be right after each.
# Weekly, as it takes hours; PRs test the tool itself on a small company (tests/tools).
on:
  schedule:
    - cron: "17 9 * * 6" # Saturdays 09:17 UTC
  workflow_dispatch:
    inputs:
      units:
        description: "Units in the company"
        required: false
        default: "20000"
      seconds:
        description: "Seconds of staff at work (3600: the hour soak)"
        required: false
        default: "3600"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DBMATE_VERSION: v2.36.0
  DBMATE_SHA256: 47e284b3d8cbad1ba5f090495aa05afd1bbd5f35e2ed5577aad06da74ce780ce
  DATABASE_URL: postgres://postgres@localhost:5432/pms?sslmode=disable

jobs:
  enterprise:
    name: enterprise, 20,000 units for an hour (weekly)
    runs-on: ubuntu-24.04
    # A cap to stop a hung run, not a budget: see docs/CI.md for the measured time.
    timeout-minutes: 300
    services:
      postgres:
        image: mirror.gcr.io/library/postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install dbmate
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          curl -fsSL -o "$RUNNER_TEMP/bin/dbmate" \
            "https://github.com/amacneil/dbmate/releases/download/${DBMATE_VERSION}/dbmate-linux-amd64"
          echo "${DBMATE_SHA256}  $RUNNER_TEMP/bin/dbmate" | sha256sum --check
          chmod +x "$RUNNER_TEMP/bin/dbmate"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Use pg_dump 16
        run: |
          if [ ! -x /usr/lib/postgresql/16/bin/pg_dump ]; then
            sudo apt-get update -q && sudo apt-get install -y -q postgresql-client-16
          fi
          echo /usr/lib/postgresql/16/bin >> "$GITHUB_PATH"
      - run: pip install -r requirements-dev.txt
      - name: The company brought over, run, worked on and restored, every step timed
        env:
          PYTHONPATH: src
          UNITS: ${{ inputs.units || '20000' }}
          SECONDS_AT_WORK: ${{ inputs.seconds || '3600' }}
        run: |
          set -o pipefail
          python -m tools.enterprise --units "$UNITS" --staff 50 --seconds "$SECONDS_AT_WORK" \
            --history-years 5 --seed "$GITHUB_RUN_ID" | tee -a "$GITHUB_STEP_SUMMARY"
