name: simulate

# scripts/simulate.ps1 (README, "Simulate people using it"): every browser test played against a
# fresh synthetic company (compose.e2e.yaml), in each browser and time zone picked, by PowerShell
# as on a Windows machine (pwsh is on GitHub's runners). A PR that changes the script, its stack,
# the browser tests' config or this file runs it once, in Chromium and UTC as e2e.yml does, to
# show the script itself works (the job budget in docs/CI.md: no other PR runs it). By hand (Run
# workflow) it runs any browsers and time zones; what fails there is a lead to fix before it runs
# on a schedule. PSScriptAnalyzer (MIT, a pinned version) lints the script first. No secrets
# beyond the automatic read-only token.
on:
  workflow_dispatch:
    inputs:
      browsers:
        description: "Browsers, comma-separated: msedge, chrome, chromium, firefox, webkit"
        default: chromium,firefox,msedge
      time_zones:
        description: "Time zones, comma-separated IANA names"
        default: UTC,America/Los_Angeles,Pacific/Kiritimati
  pull_request:
    paths:
      - scripts/simulate.ps1
      - compose.e2e.yaml
      - frontend/playwright.config.ts
      - .github/workflows/simulate.yml

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PSSCRIPTANALYZER_VERSION: 1.23.0

jobs:
  simulate:
    name: simulate (PowerShell)
    runs-on: ubuntu-24.04
    # Nine runs of the browser tests by hand; one on a PR.
    timeout-minutes: 300
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The portal is built and tested with Node 22 (e2e.yml's Node image); the runner keeps it in
      # its tool cache, so no action is added to put it on the PATH.
      - name: Node 22 from the runner's tool cache
        run: |
          node22=$(find /opt/hostedtoolcache/node -maxdepth 1 -name '22.*' | sort -V | tail -1)
          test -n "$node22" || { echo "no Node 22 in the runner's tool cache"; exit 1; }
          echo "$node22/x64/bin" >> "$GITHUB_PATH"
      - name: Lint the script (PSScriptAnalyzer)
        shell: pwsh
        run: |
          Install-Module -Name PSScriptAnalyzer -RequiredVersion $env:PSSCRIPTANALYZER_VERSION -Scope CurrentUser -Force
          # Write-Host is how a console script speaks to the person running it.
          Invoke-ScriptAnalyzer -Path scripts/simulate.ps1 -Severity Warning, Error -ExcludeRule PSAvoidUsingWriteHost -EnableExit
      - name: Simulate people using the PMS
        shell: pwsh
        env:
          BROWSERS: ${{ inputs.browsers || 'chromium' }}
          TIME_ZONES: ${{ inputs.time_zones || 'UTC' }}
        run: |
          $browsers = @($env:BROWSERS -split ',' | ForEach-Object { $_.Trim() } | Where-Object { $_ })
          $zones = @($env:TIME_ZONES -split ',' | ForEach-Object { $_.Trim() } | Where-Object { $_ })
          ./scripts/simulate.ps1 -Plan -Browsers $browsers -TimeZones $zones
          ./scripts/simulate.ps1 -Browsers $browsers -TimeZones $zones
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: simulate-reports
          path: |
            frontend/playwright-report/simulate
            frontend/test-results/simulate
          retention-days: 7
          if-no-files-found: warn
