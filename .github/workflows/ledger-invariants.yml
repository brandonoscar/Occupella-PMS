name: ledger-invariants

# Property-based tests (Hypothesis): random sequences of postings against the ledger, with the
# money invariants checked after every step. PRs: ci/thresholds.toml pr_examples per property.
# Nightly: nightly_examples per property, each twice with a seed of its own; the tests rotate,
# a part of them each night (ci/property-times.toml), shared out over 4 shards (8 jobs). Any
# failing case is uploaded as an artifact (synthetic data only). Nightly also runs the timing
# tests 50 times, the API fuzz deeper, the many-staff soak (tools/contention.py), five years of
# a company's nights (tools/fast_forward.py) and the speed test (tools/speed.py).
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * *" # nightly 03:17 UTC
  workflow_dispatch:
    inputs:
      rotation:
        description: "Which part of the property tests to run, 1 to ci/property-times.toml's rotations (empty: tonight's)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

env:
  DBMATE_VERSION: v2.36.0
  DBMATE_SHA256: 47e284b3d8cbad1ba5f090495aa05afd1bbd5f35e2ed5577aad06da74ce780ce
  DATABASE_URL: postgres://postgres@localhost:5432/pms?sslmode=disable

jobs:
  properties:
    name: properties
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-24.04
    # 19m26s on PR #121, with more state machines to come; a cap to stop a hung run, not a budget.
    timeout-minutes: 35
    services:
      postgres:
        image: mirror.gcr.io/library/postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install dbmate
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          curl -fsSL -o "$RUNNER_TEMP/bin/dbmate" \
            "https://github.com/amacneil/dbmate/releases/download/${DBMATE_VERSION}/dbmate-linux-amd64"
          echo "${DBMATE_SHA256}  $RUNNER_TEMP/bin/dbmate" | sha256sum --check
          chmod +x "$RUNNER_TEMP/bin/dbmate"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - run: pip install -r requirements-dev.txt
      - name: Property tests (pr profile)
        env:
          HYPOTHESIS_PROFILE: pr
        run: |
          set -o pipefail
          mkdir -p failing-case
          pytest tests/properties -v -p no:cacheprovider --hypothesis-show-statistics \
            --junitxml=failing-case/junit.xml 2>&1 | tee failing-case/pytest.log
      - name: Upload the failing case
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: failing-case-pr
          path: |
            failing-case/
            .hypothesis/
          include-hidden-files: true
          retention-days: 14

  nightly:
    name: properties (nightly, shard ${{ matrix.shard }}/4, seed ${{ matrix.seed }})
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    # 3,000 examples cost far more than 15 times 200: Hypothesis starts small and grows its
    # examples, so 200 are mostly small ones. The audit property alone ran past 100 minutes
    # (2026-10-23, measured locally), and every nightly job from 10/11 to 10/23 was cancelled
    # at the old 90-minute limit with nothing checked. So the tests rotate: night n (days since
    # 1970) runs part n mod rotations + 1, each part dealt into 4 shards by measured time
    # (ci/property-times.toml, which tests/tools/test_property_times.py checks fits), and every
    # property gets its full nightly run once a rotation. The step stops at job_minutes; this
    # limit only catches a hang in setup.
    timeout-minutes: 285
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
        seed: [1, 2]
    services:
      postgres:
        image: mirror.gcr.io/library/postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install dbmate
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          curl -fsSL -o "$RUNNER_TEMP/bin/dbmate" \
            "https://github.com/amacneil/dbmate/releases/download/${DBMATE_VERSION}/dbmate-linux-amd64"
          echo "${DBMATE_SHA256}  $RUNNER_TEMP/bin/dbmate" | sha256sum --check
          chmod +x "$RUNNER_TEMP/bin/dbmate"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - run: pip install -r requirements-dev.txt
      - name: Property tests (nightly profile, tonight's part, this job's shard and seed)
        env:
          HYPOTHESIS_PROFILE: nightly
          # Tonight's part of the tests dealt into 4 shards by their measured seconds, longest
          # first (tools/run_rules.py part_of).
          PMS_TEST_SHARD: ${{ matrix.shard }}/4
          PMS_TEST_SHARD_TIMES: ci/property-times.toml
          ROTATION: ${{ inputs.rotation }}
          # A different seed per job and per night: the run id, the shard and the matrix seed.
          SEED: ${{ github.run_id }}${{ matrix.shard }}${{ matrix.seed }}
        # Stopped at job_minutes with an interrupt, pytest reports what it ran and the job fails
        # (red, and in the failing-case artifact), never cancelled with nothing said.
        run: |
          set -o pipefail
          mkdir -p failing-case
          read -r parts minutes < <(python -c "import tomllib; t = tomllib.load(open('ci/property-times.toml', 'rb')); print(t['rotations'], t['job_minutes'])")
          export PMS_TEST_ROTATION="${ROTATION:-$(( $(date -u +%s) / 86400 % parts + 1 ))}/$parts"
          echo "seed=$SEED rotation=$PMS_TEST_ROTATION" | tee failing-case/seed.txt
          timeout --signal=INT --kill-after=2m "${minutes}m" \
            pytest tests/properties -v -p no:cacheprovider --durations=0 --hypothesis-seed="$SEED" \
            --junitxml=failing-case/junit.xml 2>&1 | tee failing-case/pytest.log
      - name: Upload the failing case
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: failing-case-shard-${{ matrix.shard }}-seed-${{ matrix.seed }}
          path: |
            failing-case/
            .hypothesis/
          include-hidden-files: true
          retention-days: 30

  timing:
    # Tests that depend on threads, lock waits or timeouts (@pytest.mark.timing) pass once per
    # PR; a flaky one only shows up over many runs. Fifty runs a night on GitHub's runners, and
    # one failure fails the job: a flake gets fixed, never retried away.
    name: timing tests (nightly, 50 runs)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: mirror.gcr.io/library/postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install dbmate
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          curl -fsSL -o "$RUNNER_TEMP/bin/dbmate" \
            "https://github.com/amacneil/dbmate/releases/download/${DBMATE_VERSION}/dbmate-linux-amd64"
          echo "${DBMATE_SHA256}  $RUNNER_TEMP/bin/dbmate" | sha256sum --check
          chmod +x "$RUNNER_TEMP/bin/dbmate"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - run: pip install -r requirements-dev.txt
      - name: Every timing test, 50 times (pytest exits non-zero if none are marked)
        run: |
          failed=0
          for run in $(seq 1 50); do
            if ! pytest -q -p no:cacheprovider -m timing tests; then
              failed=$((failed + 1))
              echo "::error::run $run of 50 failed"
            fi
          done
          echo "Timing tests: $failed of 50 runs failed." | tee -a "$GITHUB_STEP_SUMMARY"
          test "$failed" -eq 0

  fuzz:
    # Every PR sends each API operation the schema's boundary cases and [fuzz] pr_examples
    # generated requests (tests/api/test_api_fuzz.py, in ci.yml's tests); nightly sends
    # nightly_examples, with a new seed each night. A server error fails the job. All 331
    # operations in one job no longer fit its hour (every night from 10/11 to 10/23 was
    # cancelled at it), so four jobs each take the operations a hash of "METHOD /path" gives
    # them (PMS_FUZZ_SHARD, tools/run_rules.py), together every operation once.
    name: API fuzz (nightly, shard ${{ matrix.shard }}/4)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    services:
      postgres:
        image: mirror.gcr.io/library/postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install dbmate
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          curl -fsSL -o "$RUNNER_TEMP/bin/dbmate" \
            "https://github.com/amacneil/dbmate/releases/download/${DBMATE_VERSION}/dbmate-linux-amd64"
          echo "${DBMATE_SHA256}  $RUNNER_TEMP/bin/dbmate" | sha256sum --check
          chmod +x "$RUNNER_TEMP/bin/dbmate"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - run: pip install -r requirements-dev.txt
      - name: This job's API operations, nightly depth
        env:
          HYPOTHESIS_PROFILE: nightly
          PMS_FUZZ_SHARD: ${{ matrix.shard }}/4
          SEED: ${{ github.run_id }}${{ matrix.shard }}
        # Stopped ten minutes before the job's limit, the run fails (not cancelled) and says
        # where it was, so a night that runs long is seen.
        run: |
          timeout --signal=INT --kill-after=2m 50m \
            pytest -v -p no:cacheprovider --hypothesis-seed="$SEED" tests/api/test_api_fuzz.py

  contention:
    # Many staff at once on one company's books (tools/contention.py): 16 workers taking
    # payments, bouncing them, paying bills and owners, taking fees and running rent for five
    # minutes, then the books checked. A deadlock or any error the API would answer with a 500
    # fails the job. Measured locally: 8,681 operations in 60 s, none failed.
    name: many staff at once (nightly)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: mirror.gcr.io/library/postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install dbmate
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          curl -fsSL -o "$RUNNER_TEMP/bin/dbmate" \
            "https://github.com/amacneil/dbmate/releases/download/${DBMATE_VERSION}/dbmate-linux-amd64"
          echo "${DBMATE_SHA256}  $RUNNER_TEMP/bin/dbmate" | sha256sum --check
          chmod +x "$RUNNER_TEMP/bin/dbmate"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - run: pip install -r requirements-dev.txt
      - name: Sixteen staff for five minutes, then the books checked
        env:
          PYTHONPATH: src
        run: |
          set -o pipefail
          python -m tools.contention --workers 16 --seconds 300 --seed "$GITHUB_RUN_ID" \
            | tee -a "$GITHUB_STEP_SUMMARY"

  fast-forward:
    # A company lived through every night of five years (tools/fast_forward.py): the nightly run
    # for each day, then its tenants paying by their habits (on time, late, half then the rest,
    # two months at once, now and then a bounce), its owners and bills paid, and its books
    # checked after each night: nothing dated after the night, nothing charged twice, the
    # delinquency report, trial balance, balance sheet, owners' statements and management fees
    # right. Each night a new seed; a failure prints the seed that replays it.
    name: fast-forward five years (nightly)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    services:
      postgres:
        image: mirror.gcr.io/library/postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install dbmate
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          curl -fsSL -o "$RUNNER_TEMP/bin/dbmate" \
            "https://github.com/amacneil/dbmate/releases/download/${DBMATE_VERSION}/dbmate-linux-amd64"
          echo "${DBMATE_SHA256}  $RUNNER_TEMP/bin/dbmate" | sha256sum --check
          chmod +x "$RUNNER_TEMP/bin/dbmate"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - run: pip install -r requirements-dev.txt
      - name: Five years of nights, the books checked after each
        env:
          PYTHONPATH: src
        run: |
          set -o pipefail
          python -m tools.fast_forward --months 60 --seed "$GITHUB_RUN_ID" \
            | tee -a "$GITHUB_STEP_SUMMARY"

  speed:
    # How fast the API answers ten staff at once on a 1,000-unit company with a year of books
    # (tools/speed.py): the server as `python -m pms.api` runs it, its ten database connections
    # shared, staff signed in over HTTP for five minutes, pausing about a second between pages.
    # Measured locally: pages at most 728 ms at the 95th percentile, PDFs 1.5 s. An answer that
    # isn't 2xx, or anything whose 95th percentile is over its ceiling in ci/thresholds.toml
    # ([speed]), fails the job.
    name: speed, ten staff on 1,000 units (nightly)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    services:
      postgres:
        image: mirror.gcr.io/library/postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install dbmate
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          curl -fsSL -o "$RUNNER_TEMP/bin/dbmate" \
            "https://github.com/amacneil/dbmate/releases/download/${DBMATE_VERSION}/dbmate-linux-amd64"
          echo "${DBMATE_SHA256}  $RUNNER_TEMP/bin/dbmate" | sha256sum --check
          chmod +x "$RUNNER_TEMP/bin/dbmate"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - run: pip install -r requirements-dev.txt
      - name: Ten staff for five minutes on 1,000 units, every answer timed
        env:
          PYTHONPATH: src
        run: |
          set -o pipefail
          python -m tools.speed --units 1000 --staff 10 --months 12 --seconds 300 --pause 1 \
            --seed "$GITHUB_RUN_ID" | tee -a "$GITHUB_STEP_SUMMARY"
