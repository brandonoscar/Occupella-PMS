name: e2e

# The portal (frontend/), end to end. Typecheck, unit-test (vitest) and build the React app
# inside the pinned Node image, so the runner's own Node never matters. Then serve the build
# from the API (python -m pms.api) on a fresh Postgres 16, seed a synthetic PMC
# (frontend/e2e/seed.py) and drive it in Chromium with Playwright, inside the pinned Playwright
# image (its browsers match @playwright/test in frontend/package.json).
#
# licenses.yml calls it after its own short job on every PR and push to main, so PR CI never
# runs more than 8 jobs at once (docs/CI.md, "Job budget").
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

env:
  DBMATE_VERSION: v2.36.0
  DBMATE_SHA256: 47e284b3d8cbad1ba5f090495aa05afd1bbd5f35e2ed5577aad06da74ce780ce
  DATABASE_URL: postgres://postgres@localhost:5432/pms?sslmode=disable
  NODE_IMAGE: mirror.gcr.io/library/node:22.22.0-slim@sha256:dd9d21971ec4395903fa6143c2b9267d048ae01ca6d3ea96f16cb30df6187d94
  PLAYWRIGHT_IMAGE: mcr.microsoft.com/playwright:v1.64.0-noble@sha256:06a9939e57531807f8d5fd76ce44b53165ffb7d7501d87ab10e285c20b1e971f

jobs:
  e2e:
    name: e2e
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: mirror.gcr.io/library/postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install dbmate
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          curl -fsSL -o "$RUNNER_TEMP/bin/dbmate" \
            "https://github.com/amacneil/dbmate/releases/download/${DBMATE_VERSION}/dbmate-linux-amd64"
          echo "${DBMATE_SHA256}  $RUNNER_TEMP/bin/dbmate" | sha256sum --check
          chmod +x "$RUNNER_TEMP/bin/dbmate"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - run: pip install -r requirements.txt
      # oxlint (MIT) for correctness and accessibility, knip (ISC) for unused files, exports and
      # dependencies.
      - name: Typecheck, lint, unit-test and build the portal (Node 22)
        run: |
          docker run --rm -v "$PWD/frontend:/w" -w /w "$NODE_IMAGE" \
            sh -c "npm ci --no-audit --no-fund && npm run typecheck && npm run lint && npm run knip && npm test && npm run build"
      - name: Apply every migration
        run: dbmate --no-dump-schema up
      - name: Serve the portal and seed a synthetic PMC
        run: |
          # The fake screening partner pulls no report: it answers from the application's numbers.
          # The fake email sender keeps each email in the outbox and sends it nowhere.
          # The nightly rent run is off: the tests charge rent when they mean to (Run rent now).
          # The fake geocoder calls nothing: it lands each address on a point of its own.
          # The fake payments partner moves no money: its page's buttons say what the bank did.
          # A throwaway key, made here for this run, seals the synthetic payees' account numbers;
          # it is never printed or kept, and no stored secret is used (ADR 0009).
          PMS_DATA_KEY="$(python -c 'import base64, os; print(base64.b64encode(os.urandom(32)).decode())')"
          export PMS_DATA_KEY
          PYTHONPATH=src PMS_STATIC_DIR=frontend/dist PMS_PORT=8123 \
            PMS_PUBLIC_URL=http://127.0.0.1:8123 PMS_COOKIE_SECURE=false \
            PMS_SCREENING_PARTNER=fake PMS_EMAIL_SENDER=fake PMS_GEOCODER=fake PMS_PAYMENTS=fake \
            PMS_NIGHTLY=off \
            nohup python -m pms.api > "$RUNNER_TEMP/api.log" 2>&1 &
          for _ in $(seq 30); do curl -fsS http://127.0.0.1:8123/health && break; sleep 1; done
          PYTHONPATH=src python frontend/e2e/seed.py > frontend/e2e/.seed.json
      - name: Drive it in Chromium (Playwright)
        run: |
          docker run --rm --network host --ipc host -v "$PWD/frontend:/w" -w /w -e CI=1 \
            "$PLAYWRIGHT_IMAGE" npx playwright test
      - name: Every feature verified in this run (ci/features.toml)
        run: |
          # Playwright's own list of the browser tests, and the API's access log of the run: each
          # feature's tests exist, every test belongs to a feature, every operation a feature
          # claims was called, and no request was answered with a server error.
          docker run --rm -v "$PWD/frontend:/w" -w /w "$PLAYWRIGHT_IMAGE" \
            npx playwright test --list --reporter=json > "$RUNNER_TEMP/browser-tests.json"
          python -m tools.check_features --browser-tests "$RUNNER_TEMP/browser-tests.json" \
            --api-log "$RUNNER_TEMP/api.log"
      - name: Keep the report and the API's log
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-report
          path: |
            frontend/playwright-report
            frontend/test-results
            ${{ runner.temp }}/api.log
          retention-days: 7
