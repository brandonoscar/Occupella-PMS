name: ci

# Lint, format, typecheck, the synthetic-data scan, the standing-rule checks, and the example
# tests; and the email the PMS sends, through Mailpit. Property tests run in
# ledger-invariants.yml; coverage in coverage.yml. No secrets, no LLM calls.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  DBMATE_VERSION: v2.36.0
  # sha256 of dbmate-linux-amd64 v2.36.0, computed when it was pinned (dbmate publishes none).
  DBMATE_SHA256: 47e284b3d8cbad1ba5f090495aa05afd1bbd5f35e2ed5577aad06da74ce780ce
  # Throwaway Postgres service with trust auth: there is no password anywhere.
  DATABASE_URL: postgres://postgres@localhost:5432/pms?sslmode=disable
  # Mailpit (MIT), the mail server the email job sends to, built from its source with the Go
  # image the self-host Dockerfile pins (keep the two digests the same).
  MAILPIT_VERSION: v1.31.6
  GO_IMAGE: mirror.gcr.io/library/golang:1.27.2-bookworm@sha256:5cf287a799e6b94384bad13d16b14904c531f51ba65792237e122ce42b392f61

jobs:
  ci:
    name: ci
    runs-on: ubuntu-24.04
    # The example tests alone took 8m55s on PR #120 and outgrew 10 minutes with migrations 0078
    # to 0080; a cap to stop a hung run, not a budget. The whole job took 17m51s to 19m07s on
    # 10/21 (PRs #140, #142, #144), and one run of #144's commit was stopped at 20 minutes with
    # its tests still passing.
    timeout-minutes: 30
    permissions:
      contents: read
      issues: read # check_registry reads whether each pending issue is still open
    services:
      postgres:
        image: mirror.gcr.io/library/postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install dbmate
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          curl -fsSL -o "$RUNNER_TEMP/bin/dbmate" \
            "https://github.com/amacneil/dbmate/releases/download/${DBMATE_VERSION}/dbmate-linux-amd64"
          echo "${DBMATE_SHA256}  $RUNNER_TEMP/bin/dbmate" | sha256sum --check
          chmod +x "$RUNNER_TEMP/bin/dbmate"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Use pg_dump 16
        run: |
          if [ ! -x /usr/lib/postgresql/16/bin/pg_dump ]; then
            sudo apt-get update -q && sudo apt-get install -y -q postgresql-client-16
          fi
          echo /usr/lib/postgresql/16/bin >> "$GITHUB_PATH"
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Format
        run: ruff format --check .
      - name: Typecheck
        run: mypy
      - name: Synthetic data only (no real-looking bank numbers, tax IDs, emails or phones)
        run: python -m tools.check_synthetic_data
      - name: Shell scripts (shellcheck, preinstalled on the runner)
        run: shellcheck scripts/*.sh
      - name: GitHub workflows (zizmor, offline; medium severity and up)
        run: zizmor --offline --min-severity medium .github/workflows
      - name: Standing rule (tests come with the code)
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python -m tools.check_pr_rules --base "$BASE_SHA" --head "$HEAD_SHA"
      - name: No threshold lowered
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python -m tools.check_thresholds --base "$BASE_SHA"
      - name: Every invariant tested or tracked by an open issue
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python -m tools.check_registry --check-issues --base "$BASE_SHA"
      - name: Every API operation belongs to a feature with browser tests (ci/features.toml)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python -m tools.check_features --base "$BASE_SHA"
      - name: Unit and example tests (fresh database, every migration; no skips)
        run: pytest -v --ignore=tests/properties -p no:cacheprovider

  email:
    # The email the PMS sends, for real (tests/test_email_mailpit.py, `pytest -m mailpit`): each
    # kind handed to Mailpit over STARTTLS and read back, text and HTML, and Mailpit's HTML check
    # of what mail programs support against ci/thresholds.toml [email]. After ci, so a PR runs
    # at most 8 jobs at once (docs/CI.md, "Job budget").
    name: email (Mailpit)
    needs: ci
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    services:
      postgres:
        image: mirror.gcr.io/library/postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install dbmate
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          curl -fsSL -o "$RUNNER_TEMP/bin/dbmate" \
            "https://github.com/amacneil/dbmate/releases/download/${DBMATE_VERSION}/dbmate-linux-amd64"
          echo "${DBMATE_SHA256}  $RUNNER_TEMP/bin/dbmate" | sha256sum --check
          chmod +x "$RUNNER_TEMP/bin/dbmate"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Build Mailpit (every module checked against Go's checksum database)
        # A module download can drop mid-stream (proxy.golang.org did, on PR #132): up to three
        # tries, the modules already fetched kept between them (writable, so the runner can delete
        # them). A checksum mismatch fails all three.
        run: |
          mkdir -p "$RUNNER_TEMP/go"
          for try in 1 2 3; do
            if docker run --rm --user "$(id -u):$(id -g)" -v "$RUNNER_TEMP/bin:/out" \
              -v "$RUNNER_TEMP/go:/tmp/go" \
              -e GOBIN=/out -e GOCACHE=/tmp/go-cache -e GOPATH=/tmp/go -e CGO_ENABLED=0 \
              -e GOFLAGS="-trimpath -modcacherw" -e GOTOOLCHAIN=local \
              "$GO_IMAGE" go install "github.com/axllent/mailpit@${MAILPIT_VERSION}"; then
              break
            fi
            if [ "$try" = 3 ]; then exit 1; fi
            echo "::warning::building Mailpit failed (try $try of 3); trying again in 15 seconds"
            sleep 15
          done
          # Offline: its default release check asks GitHub's API, which answered 403 on PR #139.
          "$RUNNER_TEMP/bin/mailpit" version --no-release-check
      - run: pip install -r requirements-dev.txt
      - name: Email through Mailpit (fresh database, every migration; no skips)
        run: pytest -v -m mailpit -p no:cacheprovider
