name: licenses

# Every dependency, direct or transitive (Python and the portal's npm packages), must carry a
# license on the allowlist in ci/licenses.toml: compatible with this repo's Apache-2.0, never
# non-commercial or source-available. Then the portal's end-to-end check (e2e.yml) runs,
# chained here so PR CI stays within 8 jobs at a time.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  licenses:
    name: licenses
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Check every dependency's license
        run: python -m tools.check_licenses

  e2e:
    name: e2e
    needs: licenses
    # The portal is checked whatever the licenses said; only a cancelled run skips it.
    if: ${{ !cancelled() }}
    permissions:
      contents: read
    uses: ./.github/workflows/e2e.yml
