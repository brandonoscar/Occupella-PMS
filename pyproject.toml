[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers --strict-config"
xfail_strict = true

[tool.mypy]
# Strict on everything that ships or guards CI. Tests are plain pytest and not type-checked.
python_version = "3.11"
files = ["tools", "selfhost", "scripts"]
strict = true

[tool.coverage.run]
branch = true
source = ["tools", "selfhost", "scripts"]

[tool.coverage.report]
exclude_also = ['if __name__ == "__main__":']
