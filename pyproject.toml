[tool.ruff]
target-version = "py311"
line-length = 100
src = [".", "src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]
addopts = "-ra --strict-markers --strict-config"
xfail_strict = true
markers = [
    "timing: depends on threads, lock waits or timeouts; ledger-invariants.yml repeats it nightly",
]

[tool.mypy]
# Strict on everything that ships or guards CI. Tests are plain pytest and not type-checked.
python_version = "3.11"
files = ["tools", "selfhost", "scripts", "src"]
mypy_path = "src"
strict = true

[tool.coverage.run]
branch = true
source = ["tools", "selfhost", "scripts", "src"]

[tool.coverage.report]
exclude_also = ['if __name__ == "__main__":']
