# Self-host smoke setup: plain Postgres 16 and the image built from ./Dockerfile, nothing from
# Supabase. CI runs it in .github/workflows/selfhost.yml:
#   docker compose build
#   docker compose run --rm migrate
#   docker compose run --rm smoke
#   docker compose up -d --wait app    (the API; healthy once /health answers)
#
# Not a production setup: the database trusts every connection inside this compose network,
# publishes no port, and has no TLS and no backups.
services:
  db:
    image: mirror.gcr.io/library/postgres:19@sha256:bb6e70add742cd868fb62cb3b2f67d1dd2bdd2b65a521e778420748753687c60
    environment:
      POSTGRES_HOST_AUTH_METHOD: trust
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 5s
      retries: 30

  migrate:
    build: .
    image: occupella-pms:local
    environment:
      DATABASE_URL: postgres://postgres@db:5432/pms?sslmode=disable
    depends_on:
      db:
        condition: service_healthy

  smoke:
    image: occupella-pms:local
    command: ["python", "-m", "selfhost.smoke"]
    environment:
      DATABASE_URL: postgres://postgres@db:5432/pms?sslmode=disable
    depends_on:
      db:
        condition: service_healthy

  app:
    image: occupella-pms:local
    command: ["python", "-m", "pms.api"]
    environment:
      DATABASE_URL: postgres://postgres@db:5432/pms?sslmode=disable
      PMS_HOST: 0.0.0.0
      PMS_PUBLIC_URL: http://localhost:8000
      # Plain http inside this network; behind TLS in a real setup, leave it at "true".
      PMS_COOKIE_SECURE: "false"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"
      interval: 2s
      timeout: 5s
      retries: 30
    depends_on:
      db:
        condition: service_healthy
