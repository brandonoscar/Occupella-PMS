id = "lease-signing"
statement = "A signer signs on the PMS's own page through their link (ADR 0008): they read the consumer disclosures and agree to sign electronically or ask for paper, open the lease, type their name and maybe draw their signature, then keep the lease and its signing certificate; staff see how far each signer got, make new links and download the certificate; a tenant downloads their lease as signed, its certificate and the lease documents staff keep on its Files tab (q120)."
operations = [
  "GET /api/tenant/leases/{lease_id}/signed-lease",
  "GET /api/tenant/leases/{lease_id}/signing-certificate",
  "GET /api/tenant/leases/{lease_id}/documents/{document_id}",
  "POST /api/signing/view",
  "POST /api/signing/consent",
  "POST /api/signing/paper",
  "POST /api/signing/document",
  "POST /api/signing/sign",
  "POST /api/signing/certificate",
  "POST /api/leasing/offers/{offer_id}/links",
  "GET /api/leasing/offers/{offer_id}/certificate",
]
browser = [
  "portal.spec.ts › staff draft a lease with a deposit and a monthly charge and send it, void a renewal, send another; the signers sign on the PMS's own page; both become leases",
]

[[feature]]
id = "expense-accounts"
statement = "Staff add expense accounts, each on its Schedule E line, and put bills and recurring bills in them, a bill maybe split across several by lines that come to it (a bill's latest account or split is its own; a recurring bill's goes on each month it enters); an owner reads and downloads the year's income statement, by property and Schedule E line, and staff download any owner's."
operations = [
  "POST /api/setup/expense-accounts",
  "POST /api/payables/bills/{bill_id}/expense-account",
  "POST /api/payables/recurring/{recurring_id}/expense-account",
  "GET /api/owner/income-statement",
  "GET /api/owner/income-statement/download",
]
browser = [
  "features.spec.ts › staff put bills in expense accounts on Schedule E lines, and the owner reads the year's income statement",
]

[[feature]]
id = "custom-roles"
statement = "An admin makes custom roles, each allowing areas of the work, and gives them to staff; a staff member with custom roles changes only what one of them allows (the API refuses any other change, saying which area) and still sees every page; one with none works everywhere. Only an admin changes a custom role."
operations = [
  "GET /api/custom-roles",
  "POST /api/custom-roles",
  "POST /api/custom-roles/{role_id}/areas",
  "POST /api/custom-roles/{role_id}/staff",
]
browser = [
  "features.spec.ts › an admin makes a custom role and gives it: its holder changes only what it allows, and still sees everything",
]

[[feature]]
id = "budgets"
statement = "Staff budget a property's year (each owner's share apart) in one grid on the income statement's own lines (each income class, the management and leasing fees, each expense account, bills in none), month by month with a line's total spread over its months to the cent, and save every line at once, all or none; a line's latest row is its budget and an unchanged month writes nothing. The Budget vs actual view lays the lines beside what happened, and the owner's budget against actual exports like every report."
operations = [
  "GET /api/budgets",
  "POST /api/budgets",
  "GET /api/payables/owners",
]
browser = [
  "features.spec.ts › staff budget a property's year in one grid, save it at once, see it against what happened and export it",
]

[[feature]]
id = "journal-entries"
statement = "A staff member proposes a journal entry between the company's ledger accounts; another who holds the approve role posts it, through the ledger's rules (a refusal says why and moves nothing), or anyone declines it with a reason. Whoever proposed an entry never posts it."
operations = [
  "GET /api/journal",
  "POST /api/journal",
  "POST /api/journal/{entry_id}/post",
  "POST /api/journal/{entry_id}/decline",
]
browser = [
  "features.spec.ts › a bookkeeper proposes journal entries; the manager posts one, the ledger refuses one that is too much, and the manager declines it",
]

[[feature]]
id = "vendor-insurance"
statement = "Staff list the vendors a page at a time with their trade, phone, email, W-9 on file or missing and how their insurance stands; add a vendor with their trade, whether they get a 1099, how they are paid and how to reach them (no tax ID is kept), and change those on their page; record each vendor's insurance policies there (a renewal is a new policy), each coverage as it stands today: current, expiring within 30 days, or expired; Today lists what is not current, and the vendor insurance report downloads from Reports like every report."
operations = [
  "GET /api/vendors",
  "POST /api/vendors",
  "POST /api/vendors/{vendor_id}/profile",
  "POST /api/vendors/{vendor_id}/insurance",
]
browser = [
  "features.spec.ts › staff add a vendor with their trade, 1099 and how they are paid, record a vendor's insurance on their page, see it running out on Today, and record the renewal",
]

[[feature]]
id = "inspections"
statement = "Staff record a lease's move-in and move-out inspections room by room (each room once, its condition and a note), and download the latest two side by side, each room's change marked."
operations = [
  "GET /api/inspections",
  "POST /api/inspections",
]
browser = [
  "features.spec.ts › staff record a lease's move-in and move-out inspections room by room, and download them side by side",
]

[[feature]]
id = "company"
statement = "Staff keep the company's name, mailing address and logo (a PNG or JPEG), and the late fee and NSF fee terms each property added from then on starts with, from its first day; a property already there keeps its own. Owners and tenants see their manager's name, mailing address and logo in the portal."
operations = [
  "GET /api/company",
  "POST /api/company",
  "POST /api/company/logo",
  "POST /api/company/logo/remove",
  "GET /api/company/logo",
  "GET /api/company/card",
]
browser = [
  "features.spec.ts › staff keep the company's name, address, logo and the fees new properties start with; a property added then starts with them, and owners and tenants see their manager",
]

[[feature]]
id = "email"
statement = "Staff email a tenant, an owner or a vendor from their page's Email tab, and every tenant living at a property from its page; each email is signed with the staff member's name and the company's and kept on the person's Email tab with whether it went (an invite, a password reset or a bill waiting for an owner's approval too). An owner or a tenant resets a forgotten password from sign-in by an emailed link, never kept in the outbox; the answer never says whether the email has a login (docs/adr/0007-email.md)."
operations = [
  "GET /api/emails",
  "POST /api/emails",
  "POST /api/emails/property",
  "GET /api/password-reset",
  "POST /api/password-reset",
]
browser = [
  "features.spec.ts › staff email a tenant from their page and every tenant of a property, an owner resets a forgotten password by email, and each email shows on the person's Email tab",
]

[[feature]]
id = "automatic-email"
statement = "Staff turn on, in Company setup, the emails the PMS writes by itself while the server sends email: rent reminders some days before the first, a notice when a late fee is charged, each owner's statement for last month from a day of the month, a vendor's work order when assigned or scheduled, and each applicant's adverse action notice. Each is written once, in the run or the change that causes it, and kept on the person's Email tab with whether it went (docs/adr/0007-email.md)."
operations = [
  "GET /api/emails/settings",
  "POST /api/emails/settings",
]
browser = [
  "features.spec.ts › staff turn on the emails the PMS writes by itself, and a run of rent sends each owner last month's statement onto their Email tab",
]

[[feature]]
id = "rent-in"
statement = "Staff put a lease on a payment hold when an eviction is filed (a payment is then refused unless they accept it past the hold, naming who did) and release it from a day; take a cashier's check; print a receipt for each payment, which the tenant downloads in the portal too; and take payments to the bank together as a deposit with its slip, whose one bank line matches all of it at month-end (the founder's review, q019 to q032)."
operations = [
  "POST /api/rent/leases/{lease_id}/holds",
  "POST /api/rent/holds/{hold_id}/release",
  "GET /api/rent/payments/{transfer_id}/receipt",
  "GET /api/tenant/payments/{transfer_id}/receipt",
  "GET /api/bank-accounts/{bank_account_id}/undeposited",
  "GET /api/bank-accounts/{bank_account_id}/deposits",
  "POST /api/bank-accounts/{bank_account_id}/deposits",
  "GET /api/bank-accounts/deposits/{deposit_id}/slip",
]
browser = [
  "features.spec.ts › staff put a lease on a payment hold, accept a cashier's check past it and release it, print receipts, take payments to the bank together and print the slip; the tenant downloads their receipt",
]

[[feature]]
id = "waive"
statement = "Staff waive a charge (a late fee, an NSF fee, any fee or rent), all of it or part, with why, from the lease page: a credit linked to it that comes off that charge first, never past what is left of it, shown on the ledger (the founder's review, q019; migration 0079)."
operations = [
  "POST /api/rent/charges/{charge_id}/waive",
]
browser = [
  "features.spec.ts › staff waive a late fee from the lease page: it comes off that fee, and the ledger shows the waiver",
]

