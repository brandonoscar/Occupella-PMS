[[feature]]
id = "year-close"
statement = "Staff see last year's close on Banking: each trust bank account it touched with how far its month-end is approved, and the journal entries dated in it still waiting; once every one is approved through December 31 a staff member who holds approve closes the year, after a question, for good; from then on nothing is charged or billed with a day in it or before, and a charge dated there is refused in words (migration 0106, the founder's review q116)."
operations = ["GET /api/year-close", "POST /api/year-close"]
browser = [
  "features.spec.ts › staff approve last December in each trust bank account, close the year, and a charge dated in it is refused in words",
]

[[feature]]
id = "history-before-the-switch"
statement = "Staff bring the old system's past lines in at Settings, Import as history, a file of tenants', owners' or vendors' at a time (a tenant who left before the switch is added to hold theirs; the same file again adds nothing), and read each person's lines newest first under Before the switch on their page: a tenant's Leases tab, an owner's Statements tab, a vendor's Bills tab. History is never posted (migration 0107, the founder's review q129)."
operations = ["GET /api/history"]
browser = [
  "features.spec.ts › staff bring the old system's tenant, owner and vendor history in once, and read it under Before the switch on each page",
]

[[feature]]
id = "assistance-compliance"
statement = "Staff keep an assisted lease in compliance on its page: the household's income certifications (move-in, annual, interim; due again a year on, an interim one keeping the due day before it) and the home's inspections for its housing authority (passed, due again two years on; failed, with the day to pass a reinspection by), each saying where it stands today, and the Housing assistance compliance report lists every lease with assistance in force on a day that way, never printing income (migration 0108, the founder's review q143)."
operations = [
  "POST /api/assistance/leases/{lease_id}/certifications",
  "POST /api/assistance/leases/{lease_id}/inspections",
]
browser = [
  "features.spec.ts › staff record an assisted household's annual certification and a failed inspection, and the compliance report says where each stands",
]

[[feature]]
id = "property-addresses"
statement = "Staff keep a property's street address on its page (whole: street, maybe a building or unit, city, a state's USPS code and ZIP code; the same again writes nothing), find it on a map with the server's geocoder (PMS_GEOCODER: the Census Bureau's, or the fake one for development and CI), sending the property's address alone, and open OpenStreetMap at the point; the Properties list shows each address and finds a property by it, as the search bar does; a new address is found again (migration 0109)."
operations = [
  "POST /api/properties/{property_id}/address",
  "POST /api/properties/{property_id}/locate",
]
browser = [
  "features.spec.ts › staff add Cedar House's street address, find it on a map, find it by its street, and a new address is found again",
]

[[feature]]
id = "vendor-archive"
statement = "Staff archive a vendor with nothing open with them, after a question: they leave the Vendors list (Status, Archived lists them), the work order and bill pickers and search, and keep their history; a vendor with a bill not paid, money set aside, a work order last assigned to them still open or a recurring bill or job running stays, the refusal saying why; staff bring one back (migration 0110, the founder's review q131)."
operations = ["POST /api/vendors/{vendor_id}/archive"]
browser = [
  "features.spec.ts › staff archive a vendor with nothing open, who leaves the list, the work order picker and search, keep one with a bill not paid, and bring the first back",
]

[[feature]]
# A month run start to end (frontend/e2e/journey.spec.ts), on its own demo PMC (e2e/seed.py,
# "journey"); its operations are claimed by the features above too.
id = "a-month"
statement = "A company's month, start to end, as its people do it, with the money agreeing on every page that shows it: staff list a vacant unit, an applicant applies from the public page, is screened and approved, signs the lease (a deposit and a monthly charge) on the PMS's own page, and staff activate it and take the deposit; a renewal sent to a tenant whose lease then ends last month can no longer be sent, signed or made a lease, the End lease panel warning of it, its page saying why and offering only Void, the tenant's portal no longer offering it and its link signing nothing (H7); the month's rent runs with no late fee on rent charged that day (H1), a tenant's check has its receipt, a second check bounces with the NSF fee, and the tenant's portal, the lease page and the rent roll owe the same; a tenant's repair request with a photo becomes a work order a vendor with an email and insurance schedules and finishes through their link, its bill over the owner's limit is approved in the owner's portal, set aside and paid after a question naming the amount; last month's management fees are each agreement's percent of what was collected, the page offering nothing more to collect (H4), and exactly what Banking and the Dashboard hold as the company's fees, which leave trust; Pay owners pays an owner everything available, leaving their reserves and the bill not yet paid; a check that paid them then comes back and its bounce is refused naming the owner, the property, what it holds and how much is short, with a link to the owner's Financials, where their contribution comes in before the bounce goes through (H2); a rent goes up on a month's notice and the tenant's portal gives the next due date's rent (H3), and the lease is renewed for a year at it, signed from the tenant's portal and by link, and activated; the tenant who moved out gets their deposit back less damage, and each trust bank account's cash moves by exactly what moved; the bookkeeper imports a bank statement of every move the register shows, which before matching reads as lines not matched yet and likely in the books, never as lines to record (H5), matches it all, and prepares the month through yesterday, which the manager approves, closing the account; the owner's statement adds up and closes at what staff see; and the balance sheet ties every trust bank account's cash to what it holds and to Banking."
