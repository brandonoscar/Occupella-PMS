  "POST /api/leases/{lease_id}/occupants",
  "POST /api/leases/{lease_id}/pets",
  "POST /api/leases/{lease_id}/vehicles",
  "POST /api/leases/{lease_id}/guarantors",
  "POST /api/leases/{lease_id}/{kind}/{item_id}/remove",
]
browser = [
  "features.spec.ts › staff take one tenant off a lease, keep who else lives there and who guarantees it, and break the lease with its fee",
