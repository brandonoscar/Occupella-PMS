statement = "Staff take one tenant off a lease others stay on (their deposit moving to a tenant who stays, or staying under their name until move-out), keep the lease's other occupants, pets and assistance animals, vehicles and guarantors, end any lease from its page, and charge a property's lease-break fee when a lease ends before its end date (the founder's review, q003, q007, q011, q012; migration 0080)."
