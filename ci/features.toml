[[feature]]
id = "calendar"
statement = "A staff member (from Settings, Your calendar, maybe for one property group) or a tenant (from the portal) makes a link of their own that a calendar app subscribes to, with no login: staff see move-ins, leases ending, visits, work orders due, showings, bills due, rent changes, insurance running out and the day to take the company's fees out of trust; a tenant their rent due days, repair visits and their lease's last day. A new link takes the old one back, and a link taken back, or whose person's login is disabled, stops."
