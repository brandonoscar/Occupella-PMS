  "GET /api/leasing/vacancies",
  "POST /api/leasing/links/{link_id}/listing",
  "POST /api/leasing/listings/{listing_id}/remove",
  "GET /api/listings/{pmc_id}",
]
browser = [
  "features.spec.ts › staff list a vacant unit on the public page; someone applies from it, staff screen and approve it and record its withdrawal, take it off the page and close the link",
]

[[feature]]
id = "listing-photos"
statement = "On Listings staff see how many days each listing has been up and keep each unit's photos (JPEG or PNG, twelve at most), which the public vacancy page shows, oldest first, while the unit is listed; a removed photo leaves it."
operations = [
  "GET /api/leasing/units/{unit_id}/photos",
  "GET /api/listings/{pmc_id}/photos/{photo_id}",
]
browser = [
  "features.spec.ts › staff add photos to a listed unit, which its public listing shows; a removed one leaves it",
]

[[feature]]
id = "leads"
statement = "On Leasing, Leads (Open, Closed, All, by property group) staff add a prospect who asked about renting (a name, an email or a phone, what they asked about, the source); on the lead's page they schedule showings of a unit, record how each went, and close the lead once, applied or lost."
operations = [
  "GET /api/leasing/leads",
  "POST /api/leasing/leads",
  "GET /api/leasing/leads/{lead_id}",
  "POST /api/leasing/leads/{lead_id}/showings",
  "POST /api/leasing/showings/{showing_id}/outcome",
  "POST /api/leasing/leads/{lead_id}/close",
]
browser = [
  "features.spec.ts › staff add a lead who asked about a unit, show it to them, record how it went and close the lead when they apply",
]

[[feature]]
id = "screening-criteria"
statement = "In Company setup staff set the screening criteria every applicant is held to (the income, as times the rent, approved and approved on conditions) and the same criteria in words, which the apply page shows; the partner screens by them, a decision against the latest screening's recommendation says why, and a declined applicant reads the adverse action notice on their status page."
operations = [
  "GET /api/leasing/screening-criteria",
  "POST /api/leasing/screening-criteria",
]
browser = [
  "features.spec.ts › staff set the screening criteria; an applicant reads them, is screened by them and declined against the recommendation, and reads the notice",
]

[[feature]]
id = "lease-offers"
statement = "On Draft leases (Waiting for signatures, Leases made, Void, All, by property group) staff draft a lease for an approved applicant or a renewal of a lease, with the company's own PDF, the security deposit it asks and its monthly fees and credits, kept as a draft or sent at once; on its page they send it, void it, or activate it once everyone has signed (a tenant signs a renewal from the portal), its monthly charges becoming the lease's."
operations = [
  "GET /api/leasing/leases",
  "POST /api/leasing/applications/{application_id}/offer",
  "POST /api/leasing/leases/{lease_id}/renewal",
  "GET /api/leasing/offers",
  "GET /api/leasing/offers/{offer_id}",
  "POST /api/leasing/offers/{offer_id}/send",
  "POST /api/leasing/offers/{offer_id}/void",
  "GET /api/leasing/offers/{offer_id}/document",
  "POST /api/leasing/offers/{offer_id}/complete",
  "GET /api/tenant/renewals",
  "GET /api/tenant/renewals/{offer_id}/document",
  "POST /api/tenant/renewals/{offer_id}/signing-link",
]
browser = [
  "portal.spec.ts › staff draft a lease with a deposit and a monthly charge and send it, void a renewal, send another; the signers sign on the PMS's own page; both become leases",
]

