# Every feature of the PMS, verified working end to end: what it does, the API operations it
# rests on, and the browser tests (frontend/e2e) that use it as a person would, on a seeded
# synthetic PMC. tools/check_features.py keeps this file, the API and the browser tests in step
# (docs/CI.md, "Feature registry"):
#   - every operation the API serves is claimed by a feature, or listed under [outside] with why;
#   - every browser test named here exists, and every browser test is named by a feature;
#   - in the e2e job, every operation named here was called while the browser tests ran, and no
#     request was answered with a server error;
#   - on a PR, no feature is removed and none ends with fewer browser tests than on the base.
#
# An operation is "METHOD /path" as the API's OpenAPI schema has it (the fake partners on). A
# browser test is "<spec file> › <title>" as `npx playwright test --list` prints it.

[outside]
"GET /health" = "the server's health check: the self-host image and the browser run wait for it, and no person uses it"

[[feature]]
id = "logins"
statement = "Staff invite a staff member, owner or tenant by email; the invite sets a password (and for staff an authenticator); people sign in and out; a wrong email or password is refused without saying which; an admin disables a login for good, which signs it out."
operations = [
  "POST /api/invites",
  "POST /api/invites/view",
  "POST /api/invites/accept",
  "POST /api/invites/confirm",
  "POST /api/sign-in",
  "POST /api/sign-out",
  "GET /api/me",
  "GET /api/people",
  "POST /api/logins/{login_id}/disable",
]
browser = [
  "portal.spec.ts › an owner joins from the invite, reads their statement and signs back in",
  "portal.spec.ts › a wrong password is refused without saying which part was wrong",
  "portal.spec.ts › staff enroll an authenticator, invite a tenant and see a repair through",
  "features.spec.ts › only staff holding a role do its work: an admin grants pay-out and adds staff, staff sign in again with their code, and a disabled login is signed out for good",
]

[[feature]]
id = "staff-roles"
statement = "Only staff holding a role do its work: paying out takes disburse, approving month-end takes approve, changing roles takes admin; an admin adds staff and grants roles, and the company always keeps an admin."
operations = ["GET /api/staff", "POST /api/staff", "POST /api/staff/{staff_id}/roles"]
browser = [
  "features.spec.ts › only staff holding a role do its work: an admin grants pay-out and adds staff, staff sign in again with their code, and a disabled login is signed out for good",
]

[[feature]]
id = "today"
statement = "Staff see what is late or waits on them: late rent, bills due this week, month-end waiting for approval and applications waiting for a decision."
operations = ["GET /api/today"]
browser = [
  "features.spec.ts › staff charge this month's rent and its late fees, and Today shows the rent that is late",
  "features.spec.ts › staff add a recurring bill, enter this month's once and stop it, and record the decline of an owner with no login",
  "features.spec.ts › staff list a vacant unit on the public page; someone applies from it, staff approve, take it off the page and close the link",
]

[[feature]]
id = "setup"
statement = "Staff set up the books: trust bank accounts, owners, properties and their owners, units, tenants, vendors, leases, management terms, late fee terms and NSF fee terms."
operations = [
  "GET /api/setup",
  "POST /api/setup/bank-accounts",
  "POST /api/setup/owners",
  "POST /api/setup/properties",
  "POST /api/setup/properties/{property_id}/owners",
  "POST /api/setup/units",
  "POST /api/setup/tenants",
  "POST /api/setup/vendors",
  "POST /api/setup/leases",
  "POST /api/setup/agreements",
  "POST /api/setup/late-fees",
  "POST /api/setup/nsf-fees",
]
browser = [
  "portal.spec.ts › staff set up a property from nothing, lease a unit and see it on the rent roll",
  "features.spec.ts › staff set management terms with a leasing fee, late fees, a bank account and a vendor, and a new lease takes its leasing fee",
  "features.spec.ts › staff add a fee, a credit and a monthly charge to a lease, take a deposit and prepaid rent, and a bounce undoes a payment and charges the NSF fee",
]

[[feature]]
id = "rent-run"
statement = "Staff charge every lease its rent and recurring charges for a due date, once, and the late fees of rent still open after its grace days, once."
operations = ["GET /api/rent", "POST /api/rent/charge-rent", "POST /api/rent/late-fees"]
browser = [
  "features.spec.ts › staff charge this month's rent and its late fees, and Today shows the rent that is late",
]

[[feature]]
id = "rent-work"
statement = "Staff add a fee, a credit or a monthly charge to a lease and stop one; record a tenant's payment (what the lease owes to the owner, the rest prepaid rent), use prepaid rent, take a deposit, and record a bounce, which undoes the payment and charges the NSF fee."
operations = [
  "POST /api/rent/leases/{lease_id}/charges",
  "POST /api/rent/leases/{lease_id}/recurring-charges",
  "POST /api/rent/recurring-charges/{recurring_id}/stop",
  "POST /api/rent/leases/{lease_id}/payments",
  "POST /api/rent/leases/{lease_id}/use-prepaid",
  "POST /api/rent/deposits",
  "POST /api/rent/payments/{transfer_id}/bounce",
]
browser = [
  "features.spec.ts › staff add a fee, a credit and a monthly charge to a lease, take a deposit and prepaid rent, and a bounce undoes a payment and charges the NSF fee",
  "portal.spec.ts › staff record a tenant's payment, the rest held as prepaid rent, and then its bounce",
]

[[feature]]
id = "bills"
statement = "Staff enter a vendor's bill; one over the owner's limit emails the owner, who approves or declines it in their portal (or staff record their answer); staff set it aside from the owner's money and pay it; a declined bill is never paid."
operations = [
  "GET /api/payables/bills",
  "POST /api/payables/bills",
  "POST /api/payables/bills/{bill_id}/approval",
  "POST /api/payables/bills/{bill_id}/decline",
  "POST /api/payables/bills/{bill_id}/set-aside",
  "POST /api/payables/bills/{bill_id}/pay",
  "GET /api/payables/emails",
  "GET /api/owner/bills",
  "POST /api/owner/bills/{bill_id}/approval",
  "POST /api/owner/bills/{bill_id}/decline",
]
browser = [
  "features.spec.ts › a bill over the owner's limit emails them; they decline one and approve another in the portal, and staff pay it",
  "portal.spec.ts › staff enter a vendor's bill, record the owner's approval, set it aside and pay it, then draw the rest",
]

[[feature]]
id = "recurring-bills"
