operations = ["GET /api/today", "GET /api/dashboard"]
browser = [
  "features.spec.ts › staff charge this month's rent and its late fees, and the Dashboard shows the rent that is late",
  "features.spec.ts › staff add a recurring bill, enter this month's once and stop it, and record the decline of an owner with no login",
  "features.spec.ts › staff list a vacant unit on the public page; someone applies from it, staff approve, take it off the page and close the link",
]

