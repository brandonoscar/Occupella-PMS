  "GET /api/calendar/{token}.ics",
  "GET /api/calendar/mine",
  "POST /api/calendar/mine",
  "POST /api/calendar/mine/revoke",
  "GET /api/tenant/calendar",
  "POST /api/tenant/calendar",
  "POST /api/tenant/calendar/revoke",
]
browser = [
  "features.spec.ts › staff and a tenant each subscribe their calendar app to a link of their own; a new link takes the old one back",
]

[[feature]]
id = "own-contact"
statement = "A tenant reads and changes their own email, phones and mailing address in the portal (a mailing address whole or not there); the company writes to that email from then on, their sign-in email stays, and staff see on the tenant's page the new details and that the tenant changed them, and when."
operations = ["GET /api/tenant/contact", "POST /api/tenant/contact"]
browser = [
  "features.spec.ts › a tenant changes their own phone and email in the portal, and staff see the new ones and that the tenant changed them",
]

[[feature]]
id = "charge-types"
statement = "Staff add the company's own charge types (a name once whatever its case, none of the income statement's own lines) in Settings, Chart of accounts, and give a fee one on Enter charge or a monthly charge (never a credit); the owner's income statement counts what was collected on each type on a line of its own, after the other income, and the budget beside it counts that line as income."
