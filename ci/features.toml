# Every feature of the PMS, verified working end to end: what it does, the API operations it
# rests on, and the browser tests (frontend/e2e) that use it as a person would, on a seeded
# synthetic PMC. tools/check_features.py keeps this file, the API and the browser tests in step
# (docs/CI.md, "Feature registry"):
#   - every operation the API serves is claimed by a feature, or listed under [outside] with why;
#   - every browser test named here exists, and every browser test is named by a feature;
#   - in the e2e job, every operation named here was called while the browser tests ran, and no
#     request was answered with a server error;
#   - on a PR, no feature is removed and none ends with fewer browser tests than on the base.
#
# An operation is "METHOD /path" as the API's OpenAPI schema has it (the fake partners on). A
# browser test is "<spec file> › <title>" as `npx playwright test --list` prints it.

[outside]
"GET /health" = "the server's health check: the self-host image and the browser run wait for it, and no person uses it"

[[feature]]
id = "logins"
statement = "Staff invite a staff member, owner or tenant by email; the invite sets a password (and for staff an authenticator); people sign in and out; a wrong email or password is refused without saying which; an admin disables a login for good, which signs it out."
operations = [
  "POST /api/invites",
  "POST /api/invites/view",
  "POST /api/invites/accept",
  "POST /api/invites/confirm",
  "POST /api/sign-in",
  "POST /api/sign-out",
  "GET /api/me",
  "GET /api/people",
  "POST /api/logins/{login_id}/disable",
]
browser = [
  "portal.spec.ts › an owner joins from the invite, reads their statement and signs back in",
  "portal.spec.ts › a wrong password is refused without saying which part was wrong",
  "portal.spec.ts › staff enroll an authenticator, invite a tenant and see a repair through",
  "features.spec.ts › only staff holding a role do its work: an admin grants pay-out and adds staff, staff sign in again with their code, and a disabled login is signed out for good",
]

[[feature]]
id = "staff-roles"
statement = "Only staff holding a role do its work: paying out takes disburse, approving month-end takes approve, changing roles takes admin; an admin adds staff and grants roles, and the company always keeps an admin."
operations = ["GET /api/staff", "POST /api/staff", "POST /api/staff/{staff_id}/roles"]
browser = [
  "features.spec.ts › only staff holding a role do its work: an admin grants pay-out and adds staff, staff sign in again with their code, and a disabled login is signed out for good",
]

[[feature]]
