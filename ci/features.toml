[[feature]]
id = "documents"
statement = "Staff list every file of the company a page at a time (by category and property group, each with the record it is attached to), and keep one on any record (a property, unit, lease, tenant, owner, vendor, work order or bill, in a category that record takes: a W-9, a receipt, a move-out photo, an owner's or any record's document; a PDF, JPEG or PNG that is what it says) from Files or the record's own page, download and remove one; an owner downloads their own documents."
operations = [
  "GET /api/documents",
  "GET /api/documents/files",
  "POST /api/documents",
  "GET /api/documents/{document_id}/file",
  "POST /api/documents/{document_id}/remove",
  "GET /api/owner/documents",
  "GET /api/owner/documents/{document_id}/file",
]
browser = [
  "features.spec.ts › staff keep a vendor's W-9, a bill's receipt, a move-out photo and a property's document from Files, narrow the list, refuse a file that isn't what it says, and remove one",
  "portal.spec.ts › staff keep an owner's document and the owner downloads it from the portal",
]

[[feature]]
id = "reports"
statement = "Staff open each report from Reports, grouped as Buildium groups them, see it on screen with its filters (a day, or days with presets; an owner; a year; a property group, a property or one owner's properties when its lines have one, the general ledger and trial balance by each account's property, the lines across all properties then left out), and export it in CSV, Excel and PDF with the same filters; the whole ledger downloads as a zip of CSV from Settings, Data export, and for an admin everything the company keeps: each record table as CSV, its documents, leases and signatures as files, and the ledger, never a credential or a token's hash."
operations = ["GET /api/reports/{name}", "GET /api/ledger.zip", "GET /api/records.zip"]
browser = [
  "features.spec.ts › staff open a report from Reports, see it on screen narrowed to one property, export it in each format, take an owner's report over last year, download the whole ledger, and every staff report in each format",
  "portal.spec.ts › staff set up a property from nothing where each thing lives, lease a unit and see it on the rent roll",
]

[[feature]]
id = "owner-portal"
statement = "An owner reads their properties, a month's statement and their year-end package in the portal, and downloads each."
operations = [
  "GET /api/owner/properties",
  "GET /api/owner/statement",
  "GET /api/owner/statement/download",
  "GET /api/owner/year-end",
  "GET /api/owner/year-end/download",
]
browser = [
  "features.spec.ts › an owner reads last month's statement and their year-end package, and downloads each",
  "portal.spec.ts › an owner joins from the invite, reads their statement and signs back in",
  "portal.spec.ts › the demo opens on last month waiting for its manager, who approves it and sees on the Dashboard what else waits; its owner reads three properties",
  "phone.spec.ts › an owner reads their properties and statement on a phone",
]

[[feature]]
id = "tenant-portal"
statement = "A tenant sees their lease, what it charges each month, what they owe and paid, downloads their ledger, and once the deposit was returned, its statement."
operations = [
  "GET /api/tenant/leases",
  "GET /api/tenant/leases/{lease_id}/ledger",
  "GET /api/tenant/leases/{lease_id}/ledger/download",
  "GET /api/tenant/leases/{lease_id}/deposit-return/download",
]
browser = [
  "features.spec.ts › a tenant sees their lease, what comes each month and two months of charges and payments, and downloads them",
  "portal.spec.ts › a tenant joins, sees what is due and asks for a repair",
  "features.spec.ts › a lease ended mid-month keeps only its days of the month's rent, and its deposit goes back less what it owes",
  "phone.spec.ts › a tenant reads their lease and what they owe, and files a repair request on a phone",
]

[[feature]]
id = "maintenance"
statement = "A tenant asks for a repair; staff open a work order for it, assign a vendor and complete it, and the tenant sees where it stands."
operations = [
  "GET /api/tenant/requests",
  "POST /api/tenant/requests",
  "GET /api/maintenance/requests",
  "GET /api/maintenance/vendors",
  "POST /api/maintenance/requests/{request_id}/work-order",
  "POST /api/maintenance/work-orders/{work_order_id}/steps",
]
browser = [
  "portal.spec.ts › a tenant joins, sees what is due and asks for a repair",
  "portal.spec.ts › staff enroll an authenticator, invite a tenant and see a repair through",
]

[[feature]]
id = "applications"
statement = "Staff open an application link for a unit and close it; an applicant applies through it and follows its status; on Applicants (Open, Rejected, Withdrawn, All, by property group) staff open an application's page, screen it through the partner and approve or reject it, a rejection with its adverse action notice, or record that the applicants withdrew it, after which it takes nothing more."
operations = [
  "POST /api/leasing/links",
  "POST /api/leasing/links/{link_id}/close",
  "POST /api/apply/view",
  "POST /api/apply",
  "POST /api/application/status",
  "GET /api/leasing/applications",
  "GET /api/leasing/applications/{application_id}",
  "POST /api/leasing/applications/{application_id}/withdraw",
  "POST /api/leasing/applications/{application_id}/screen",
  "POST /api/leasing/applications/{application_id}/decide",
  "GET /api/leasing/applications/{application_id}/notice",
]
browser = [
  "portal.spec.ts › an applicant applies; staff screen, decline with a notice, and the applicant sees it",
  "features.spec.ts › staff list a vacant unit on the public page; someone applies from it, staff screen and approve it and record its withdrawal, take it off the page and close the link",
]

[[feature]]
id = "listings"
statement = "On Listings staff see each unit coming free within 90 days (or with an open link), when and at what rent, and list it on the company's public vacancy page (opening its link if it has none), where anyone sees it and applies, and unlist it."
