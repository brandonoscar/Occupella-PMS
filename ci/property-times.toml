# Each property test's seconds at the PR profile (200 examples), and the plan the nightly
# property jobs follow (.github/workflows/ledger-invariants.yml, `nightly`): night n (days since
# 1970) runs part n mod `rotations` + 1 of the tests, dealt by these seconds into `shards` jobs
# for each of two seeds (tools/run_rules.py part_of), each stopped at `job_minutes`. So every
# property gets its nightly run once every `rotations` nights. The coverage job deals its two
# shards' property tests by these seconds too (.github/workflows/coverage.yml).
# tests/tools/test_property_times.py checks that every property test is here and that each job's
# tests, times `nightly_factor`, fit in three quarters of `job_minutes`.
#
# nightly_factor: a test's nightly time (3,000 examples) over its PR time (200). It is not 15:
# Hypothesis starts with small examples and grows them, so the first 200 are the cheap ones.
# Measured on 2026-10-23 on one 4-core machine: the audit property took about 3 minutes for 200
# and was about 2,100 examples into 3,000 when stopped at 100 minutes, some 50 times its PR time.
#
# Refresh the seconds with `python -m tools.property_times` (its docstring says how).
rotations = 4
shards = 4
job_minutes = 270
nightly_factor = 60

