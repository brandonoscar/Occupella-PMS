[[invariant]]
id = "vendor-payments-carried-over-once-and-counted"
statement = "What the old system paid a vendor in a calendar year before the cutover is kept once per vendor and year, for a cutover inside that year or on the next January 1, and the year's vendor payments report adds it to what the PMS paid that vendor in the year: the vendor's line is the whole year, a line under it shows what the old system paid, and the total counts both. Other PMCs' are never counted."
