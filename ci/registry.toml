]

[[invariant]]
id = "lease-end-keeps-charged-months-at-their-days"
statement = "When a lease's end is set, moved or cleared, every charge the rent run makes for it (rent, and a recurring charge's fee or credit) that, with what followed earlier ends, stood at its month's days under the old end gets a credit or a fee, due on its own day, so it stands at its month's days under the new end (a month wholly after the end at nothing); a charge standing at anything else is left as it is. Setting the same end changes nothing, and a rent run and an end wait for each other, so no charged month misses an end."
