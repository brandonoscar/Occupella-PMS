]

[[invariant]]
id = "lease-offers-become-leases-once-signed"
statement = "A lease offer is for an approved (or conditionally approved) application at the unit it applied for, or renews a lease at its unit, starting after it. It becomes a lease only through trust_complete_lease_offer, once every signer has signed, and an application or a lease takes at most one completed offer; completing again returns the same lease. A new lease's tenants are its signers; a renewal keeps the tenants of the lease it renews, which ends the day before."
