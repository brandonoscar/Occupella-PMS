[[invariant]]
id = "applications-through-open-links"
statement = "A rental application comes only through an open application link, one staff opened for a unit of their PMC. A closed link takes none, and closing a link waits for an application on its way. Applicants have no login: their link and status tokens are kept only as SHA-256, a closed or made-up link reads the same, and a link takes at most 50 applications a day."
