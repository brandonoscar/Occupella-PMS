[[invariant]]
id = "applicants-stay-with-the-pmc"
statement = "trust_ai_agent reads no application link, application, applicant, screening, decision or adverse action. An applicant's status shows the PMC's decision and its conditions, never the screening. Screening runs only through the partner the server is set up with (none by default), and the PMS keeps only applicants' names and emails."
