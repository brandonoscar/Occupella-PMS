id = "management-fee-once-per-period"
statement = "A management fee is the agreement's percent of rent collected in the period (net of bounced payments), or its minimum if that is more, plus its flat fee. It is taken once per owner account and period, an account's fee periods never overlap, and the same period retried returns the fee taken."
tests = [
  "tests/properties/test_rent_roll_properties.py::test_rent_roll_invariants_hold_under_random_leases_charges_and_payments",
