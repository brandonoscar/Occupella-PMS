# What the ledger must guarantee, and what proves it. tools/check_registry.py fails CI when a
# listed test doesn't exist, when an entry has neither tests nor an open issue, when a pending
# issue is closed, or when a PR removes an entry or one of its tests.
#
#   tests   = test node ids that prove the entry
#   pending = the open issue for what isn't built yet (an entry may have both)

# --- Ledger invariants (ledger-invariants.yml) ---------------------------------------------

[[invariant]]
id = "debits-equal-credits"
statement = "Every transaction's debits equal its credits."
tests = [
  "tests/properties/test_ledger_properties.py::test_ledger_invariants_hold_under_random_postings",
  "tests/test_ledger_core.py::test_every_transfer_writes_entries_that_sum_to_zero",
]

[[invariant]]
id = "no-owner-ledger-below-zero"
statement = "No owner/property ledger (or any held account) goes below zero; the posting is rejected and nothing is written."
tests = [
  "tests/properties/test_ledger_properties.py::test_ledger_invariants_hold_under_random_postings",
  "tests/test_trust_model.py::test_transfer_that_would_take_owner_account_below_zero_is_refused_and_nothing_written",
  "tests/test_trust_model.py::test_no_negative_rule_does_not_rely_on_pgledgers_own_flag",
]

[[invariant]]
id = "trust-account-tie-out"
