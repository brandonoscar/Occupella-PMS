# What the ledger must guarantee, and what proves it. tools/check_registry.py fails CI when a
# listed test doesn't exist, when an entry has neither tests nor an open issue, when a pending
# issue is closed, or when a PR removes an entry or one of its tests.
#
#   tests   = test node ids that prove the entry
#   pending = the open issue for what isn't built yet (an entry may have both)

# --- Ledger invariants (ledger-invariants.yml) ---------------------------------------------

[[invariant]]
id = "debits-equal-credits"
statement = "Every transaction's debits equal its credits."
tests = [
  "tests/properties/test_ledger_properties.py::test_ledger_invariants_hold_under_random_postings",
  "tests/test_ledger_core.py::test_every_transfer_writes_entries_that_sum_to_zero",
]

[[invariant]]
id = "no-owner-ledger-below-zero"
statement = "No owner/property ledger (or any held account) goes below zero; the posting is rejected and nothing is written."
tests = [
  "tests/properties/test_ledger_properties.py::test_ledger_invariants_hold_under_random_postings",
  "tests/test_trust_model.py::test_transfer_that_would_take_owner_account_below_zero_is_refused_and_nothing_written",
  "tests/test_trust_model.py::test_no_negative_rule_does_not_rely_on_pgledgers_own_flag",
]

[[invariant]]
id = "trust-account-tie-out"
statement = "Per trust bank account: book cash = owner balances + prepaid rent + deposits held + unpaid vendor bills + the PMC's earned fees. Checked at every commit; held money changes trust bank account only with its cash."
tests = [
  "tests/properties/test_ledger_properties.py::test_ledger_invariants_hold_under_random_postings",
  "tests/test_tie_out.py::test_held_money_cannot_change_trust_account_without_its_cash",
  "tests/test_tie_out.py::test_a_deposit_kept_for_damages_moves_with_its_cash",
  "tests/test_tie_out.py::test_the_check_runs_at_commit",
]

[[invariant]]
id = "append-only-history"
statement = "Posted entries are never updated or deleted; corrections are reversing entries."
tests = [
  "tests/properties/test_ledger_properties.py::test_ledger_invariants_hold_under_random_postings",
  "tests/test_ledger_core.py::test_ledger_history_cannot_be_rewritten_even_by_the_owner",
  "tests/test_ledger_core.py::test_app_role_has_no_grant_to_rewrite_ledger_history",
]

[[invariant]]
id = "idempotency-key"
statement = "Posting with the same idempotency key twice creates one transfer and returns the original; the same key with a different posting is refused."
tests = [
  "tests/properties/test_ledger_properties.py::test_ledger_invariants_hold_under_random_postings",
  "tests/test_idempotency.py::test_same_key_twice_posts_once_and_returns_the_original",
  "tests/test_idempotency.py::test_same_key_with_different_contents_is_refused_and_nothing_written",
  "tests/test_idempotency.py::test_two_calls_with_one_key_at_once_post_once",
]

[[invariant]]
id = "reconciliation-locked"
statement = "An approved reconciliation is locked: the record never changes, its trust bank account is closed through the period's end so nothing dated inside it can be posted, and periods follow one another with no gap or overlap."
tests = [
  "tests/properties/test_ledger_properties.py::test_ledger_invariants_hold_under_random_postings",
  "tests/test_reconciliation.py::test_a_posting_dated_inside_a_closed_period_is_refused",
  "tests/test_reconciliation.py::test_periods_follow_one_another_with_no_gap_or_overlap",
  "tests/test_reconciliation.py::test_no_role_moves_the_closing_date_by_hand",
  "tests/test_reconciliation.py::test_a_posting_waits_for_an_approval_in_progress_and_is_then_refused",
  "tests/test_reconciliation.py::test_an_approval_waits_for_a_posting_in_flight_and_counts_it",
  "tests/test_reconciliation.py::test_a_posting_from_an_older_snapshot_cannot_slip_into_a_period_closed_since",
  "tests/test_ledger_core.py::test_ledger_history_cannot_be_rewritten_even_by_the_owner",
]

[[invariant]]
id = "deposits-in-deposit-account"
statement = "Security deposits sit only in the security-deposit trust account, which holds nothing else, for every PMC: no ledger account opens in the other kind of trust bank account, and a trust bank account never changes kind."
tests = [
  "tests/properties/test_ledger_properties.py::test_ledger_invariants_hold_under_random_postings",
  "tests/test_deposit_account.py::test_money_held_in_trust_opens_only_in_its_own_kind_of_account",
  "tests/test_deposit_account.py::test_the_deposit_accounts_cash_is_exactly_the_deposits_it_holds",
  "tests/test_deposit_account.py::test_a_trust_bank_accounts_kind_never_changes",
  "tests/test_deposit_account.py::test_the_migration_refuses_books_that_already_mix_them",
]

[[invariant]]
id = "broker-money-cap"
statement = "Broker money in trust can't go above a configured cap."
pending = "https://github.com/brandonoscar/Occupella-PMS/issues/7"

[[invariant]]
id = "transfers-stay-in-one-pmc"
statement = "A transfer never crosses PMCs and only touches accounts with a trust kind."
tests = [
  "tests/properties/test_ledger_properties.py::test_ledger_invariants_hold_under_random_postings",
  "tests/test_trust_model.py::test_transfer_across_pmcs_is_refused",
  "tests/test_trust_model.py::test_transfer_touching_an_account_with_no_trust_kind_is_refused",
]

[[invariant]]
id = "app-role-cannot-move-money-directly"
statement = "The app role reads the ledger and writes only through the trust functions; it posts only through trust_post_transfers, so every posting it makes carries an idempotency key."
tests = [
  "tests/test_privileges.py::test_app_role_table_privileges_are_exact",
  "tests/test_privileges.py::test_app_role_function_privileges_are_exact",
  "tests/test_privileges.py::test_every_relation_and_function_is_pinned",
  "tests/test_privileges.py::test_no_function_that_runs_as_owner_is_callable_by_public",
  "tests/test_privileges.py::test_no_role_but_the_owner_may_delete_or_truncate",
  "tests/test_trust_model.py::test_app_role_sets_up_and_posts_through_functions_only",
]

[[invariant]]
id = "ai-role-cannot-move-money"
statement = "The role behind the API key Occupella will hold (trust_ai_agent) reads what the app reads and runs the reports, and nothing else: no write on any table, no column grant, no function that writes, no other role's grants. Every posting or record change it tries is refused with nothing written."
tests = [
  "tests/properties/test_ledger_properties.py::test_ledger_invariants_hold_under_random_postings",
  "tests/properties/test_rent_roll_properties.py::test_rent_roll_invariants_hold_under_random_leases_charges_and_payments",
  "tests/test_privileges.py::test_ai_role_reads_only_what_the_app_reads",
  "tests/test_privileges.py::test_ai_role_holds_no_column_grant",
  "tests/test_privileges.py::test_ai_role_calls_only_the_reports",
  "tests/test_privileges.py::test_ai_role_has_no_powers_beyond_its_grants",
  "tests/test_ai_role.py::test_the_ai_role_cannot_move_money_or_change_a_record",
  "tests/test_ai_role.py::test_the_ai_role_writes_no_table",
  "tests/test_ai_role.py::test_the_ai_role_runs_every_report_and_sees_what_the_owner_sees",
]

[[invariant]]
id = "concurrent-postings-all-finish"
statement = "Concurrent transfers across the same accounts all finish, and the balances still add up: accounts are locked in one global order, and unrelated transfers never wait for each other."
tests = [
  "tests/test_ledger_core.py::test_concurrent_transfers_all_finish_and_balances_add_up",
  "tests/test_ledger_core.py::test_batches_lock_accounts_in_sorted_order_before_changing_anything",
  "tests/test_ledger_core.py::test_transfers_on_unrelated_accounts_do_not_wait_for_each_other",
]

[[invariant]]
id = "running-balance"
statement = "Every entry carries the account's running balance and version, chained from zero, so an auditor can walk the ledger line by line (Cal. Reg. 2831)."
tests = [
  "tests/properties/test_ledger_properties.py::test_ledger_invariants_hold_under_random_postings",
  "tests/test_ledger_core.py::test_every_entry_carries_the_running_balance_and_account_version",
]

[[invariant]]
id = "one-lease-per-unit"
statement = "Two leases of one unit never overlap, whoever writes them: each lease write waits for the others on its unit and reads every committed lease."
tests = [
  "tests/properties/test_rent_roll_properties.py::test_rent_roll_invariants_hold_under_random_leases_charges_and_payments",
  "tests/test_leases_and_charges.py::test_two_leases_of_one_unit_never_overlap",
  "tests/test_leases_and_charges.py::test_the_owner_writing_leases_directly_is_held_to_the_same_rule",
  "tests/test_leases_and_charges.py::test_a_lease_waits_for_one_in_progress_on_the_unit_and_is_then_refused",
  "tests/test_leases_and_charges.py::test_leases_of_different_units_do_not_wait_for_each_other",
  "tests/test_leases_and_charges.py::test_leases_are_written_at_read_committed",
]

[[invariant]]
id = "rent-charged-once"
statement = "A lease is charged rent at most once per due date, so a retried billing run can't bill twice; charges are append-only and corrected with a credit."
tests = [
  "tests/properties/test_rent_roll_properties.py::test_rent_roll_invariants_hold_under_random_leases_charges_and_payments",
  "tests/test_leases_and_charges.py::test_rent_is_charged_once_per_due_date_so_a_retried_run_cannot_bill_twice",
  "tests/test_leases_and_charges.py::test_charges_and_matches_are_kept_for_good",
]

[[invariant]]
id = "payments-never-overpay"
statement = "A payment is matched to a charge only within both amounts: no charge is paid past its amount, no transfer pays more than it moved, only a payment into the owner's account for the charge's property from cash or a lease tenant's held money counts, and the same match retried returns the original. A charge's paid amount is net of reversals."
tests = [
  "tests/properties/test_rent_roll_properties.py::test_rent_roll_invariants_hold_under_random_leases_charges_and_payments",
  "tests/test_leases_and_charges.py::test_a_charge_is_never_paid_past_its_amount",
  "tests/test_leases_and_charges.py::test_a_transfer_never_pays_more_than_it_moved",
  "tests/test_leases_and_charges.py::test_the_same_match_retried_returns_the_original",
  "tests/test_leases_and_charges.py::test_a_transfer_that_did_not_pay_the_leases_rent_is_refused",
  "tests/test_leases_and_charges.py::test_two_payments_at_once_cannot_overpay_a_charge",
]

[[invariant]]
id = "bounced-payments-reversed"
statement = "A payment that bounces is undone by a reversal record tied to its reversing ledger transfer, never by rewriting the match: the transfer must move the money back the way it came, dated no earlier; a reversal undoes no more than its match and spends its transfer no more than its amount; the charge can then be paid again, the bounced transfer pays nothing else, and the same reversal retried returns the original."
tests = [
  "tests/properties/test_rent_roll_properties.py::test_rent_roll_invariants_hold_under_random_leases_charges_and_payments",
  "tests/test_payment_reversals.py::test_a_bounced_payment_is_reversed_and_the_charge_can_be_paid_again",
  "tests/test_payment_reversals.py::test_a_reversal_undoes_no_more_than_the_match",
  "tests/test_payment_reversals.py::test_a_reversing_transfer_is_spent_no_more_than_its_amount",
  "tests/test_payment_reversals.py::test_a_transfer_that_does_not_move_the_money_back_is_refused",
  "tests/test_payment_reversals.py::test_a_bounced_payment_never_pays_anything_else",
  "tests/test_payment_reversals.py::test_two_reversals_at_once_cannot_undo_more_than_the_match",
]

# --- Reports (golden.yml) ------------------------------------------------------------------

[[report]]
id = "owner-statement"
statement = "Owner statement per property (opening balance, each posting in date order with the balance after it, closing balance) and per owner, compared to a checked-in golden file."
tests = [
  "tests/golden/test_golden.py::test_every_golden_case_matches",
  "tests/test_owner_statement.py::test_the_period_includes_its_start_and_not_its_end",
  "tests/properties/test_ledger_properties.py::test_ledger_invariants_hold_under_random_postings",
]

[[report]]
id = "three-way-reconciliation"
statement = "Three-way reconciliation report (bank statement, trust journal and beneficiary ledgers of one approved reconciliation, with every difference listed), compared to a checked-in golden file."
tests = [
  "tests/golden/test_golden.py::test_every_golden_case_matches",
  "tests/test_three_way_reconciliation.py::test_a_move_split_across_the_period_end_shows_in_both_accounts",
  "tests/properties/test_ledger_properties.py::test_ledger_invariants_hold_under_random_postings",
]

[[report]]
id = "rent-roll"
statement = "Rent roll as of the end of a day (UTC): per unit the lease in effect, its tenants, the deposits and prepaid rent held for them, what was charged and paid, and the balance due; then totals that tie back to every tenant's money in the trust ledger. Compared to a checked-in golden file."
tests = [
  "tests/golden/test_golden.py::test_every_golden_case_matches",
  "tests/test_rent_roll.py::test_charges_count_by_due_date_and_payments_by_their_transfers_date",
  "tests/test_rent_roll.py::test_money_for_tenants_off_the_roll_still_adds_up_to_the_ledger",
  "tests/test_rent_roll.py::test_a_bounced_payment_counts_as_unpaid_from_its_reversals_date",
  "tests/properties/test_rent_roll_properties.py::test_rent_roll_invariants_hold_under_random_leases_charges_and_payments",
]

