[[report]]
id = "rent-roll"
statement = "Rent roll as of the end of a day (UTC): per unit the lease in effect, its tenants, the deposits and prepaid rent held for them, what was charged and paid, and the balance due; then totals that tie back to every tenant's money in the trust ledger. Compared to a checked-in golden file."
