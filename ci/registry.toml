[[invariant]]
id = "cutover-opens-once-and-first"
statement = "A trust bank account opens with balances carried over from another system once, before any posting or approved reconciliation in it: posted from its cash at the start of the cutover date (UTC), adding up to the old book cash given with them. The same opening again returns the original transfers; a different one is refused. From then on no transfer touching it is dated before the cutover, whoever posts it, and its first reconciliation starts at the cutover."
