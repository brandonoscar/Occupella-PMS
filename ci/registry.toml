]

[[invariant]]
id = "rent-payments-pay-what-is-owed"
statement = "A tenant's payment recorded by staff pays the owner's account no more than the lease owes, matched in full to its open charges oldest first, and holds the rest for the tenant as prepaid rent; prepaid rent pays no more than is owed. Sending the same request again records nothing new. A bounce takes back exactly what the payment moved, once, or is refused with nothing written."
tests = [
  "tests/properties/test_rent_properties.py::test_rent_invariants_hold_under_random_charges_payments_and_bounces",
  "tests/api/test_rent.py::test_a_payment_pays_what_is_owed_oldest_first_and_holds_the_rest_as_prepaid_rent",
