]

[[invariant]]
id = "adverse-action-records"
statement = "Each application has at most one decision, resting only on a screening of its own. A declined or conditional decision that rests on a screening has its adverse action notice recorded with it (the reasons, the reporting agency, the day it was given), checked at commit, and no other decision has one."
