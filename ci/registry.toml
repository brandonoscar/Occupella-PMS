  "tests/properties/test_rent_roll_properties.py::test_rent_roll_invariants_hold_under_random_leases_charges_and_payments",
]

[[report]]
id = "trial-balance"
statement = "Trial balance as of the end of a day (UTC): per trust bank account, its book cash on the debit side and every account holding money for someone on the credit side, a total per bank account and in all; debits equal credits. Compared to a checked-in golden file."
tests = [
  "tests/golden/test_golden.py::test_every_golden_case_matches",
  "tests/test_accounting_reports.py::test_each_bank_lists_its_cash_against_what_it_holds_and_they_agree",
  "tests/properties/test_ledger_properties.py::test_ledger_invariants_hold_under_random_postings",
]

[[report]]
id = "general-ledger"
statement = "General ledger for a period of whole days (UTC): per ledger account, by trust bank account, its balance at the start, every entry dated inside the period in date order with the account on its other side and the balance after it, and its debits, credits and balance at the end, which is its balance on the trial balance; the period's debits equal its credits. Compared to a checked-in golden file."
tests = [
  "tests/golden/test_golden.py::test_every_golden_case_matches",
