]

[[invariant]]
id = "owners-page-shows-what-a-draw-takes"
statement = "What the staff owners page shows as available to draw is exactly what a draw of everything takes: the balance less the reserve of the agreement in force and the unpaid bills the database itself counts (trust_unpaid_bills); a draw of more is refused with nothing written, and sending a draw again pays nothing twice. A bill is set aside only from money the owner holds, and paid once it was."
tests = [
  "tests/properties/test_payables_properties.py::test_payables_invariants_hold_under_random_bills_contributions_and_draws",
  "tests/api/test_payables.py::test_owners_money_shows_what_a_draw_may_take",
  "tests/api/test_payables.py::test_a_draw_pays_out_what_is_available_once",
  "tests/api/test_payables.py::test_a_bill_is_paid_only_once_set_aside_and_never_into_the_negative",
]

[[invariant]]
id = "bank-matches-balance-and-stand-alone"
statement = "A trust bank account's statements follow one another from 0, each with all its lines. A statement line or a ledger transfer is in at most one match not undone, every such match comes to the same on both sides, and no match or undo changes a period already approved. A period is approved from its statements only when the books lack no line, at the bank balance they give."
tests = [
  "tests/properties/test_bank_matching_properties.py::test_bank_matching_invariants_hold_under_random_statements_matches_and_approvals",
  "tests/test_bank_statements.py::test_statements_follow_one_another_from_zero",
  "tests/test_bank_statements.py::test_a_statement_has_all_its_lines_and_they_come_to_its_closing",
  "tests/test_bank_statements.py::test_a_line_or_transfer_is_in_one_match_until_it_is_undone",
  "tests/test_bank_statements.py::test_a_match_comes_to_the_same_on_both_sides",
  "tests/test_bank_statements.py::test_matches_never_change_a_period_already_approved",
  "tests/test_bank_statements.py::test_a_period_whose_lines_the_books_lack_is_not_approved",
]

[[invariant]]
id = "a-migrated-account-reconciles-from-its-cutover"
statement = "A trust bank account carried over from another system reconciles from its first period: its first statement's balance brought forward is matched to the opening balances less the checks and deposits the bank had not cleared (frozen by a staff sign-off); each such item clears once, only after that opening match, which is never undone while an item it carries is cleared; an item carried and not cleared is outstanding; and the adjusted bank balance less book cash is exactly the bank lines the books lack."
tests = [
  "tests/properties/test_cutover_matching_properties.py::test_cutover_invariants_hold_under_random_items_statements_matches_and_approvals",
