[[invariant]]
id = "audit-log-records-every-write"
statement = "Every write to a trust record or the ledger (each transfer once) is logged with when, what (the row, and the row before an update), the database role it was made through and the staff member the application named, if any. A write naming someone not on the PMC's staff is refused with nothing written. The log is append-only, and only its trigger writes it; every trust table carries the trigger."
