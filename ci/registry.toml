[[invariant]]
id = "late-fee-once-per-late-rent"
statement = "A rent charge still unpaid at the end of its last day of grace (UTC), counting payments dated before then net of bounces dated before then, is charged one late fee: the flat fee plus the percent of what was unpaid, rounded to the cent and capped, under the property's terms in force on the rent's due date. Never more than one per rent, and none for a fee of 0.00."
