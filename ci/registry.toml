statement = "The rent run charges every recurring charge in force on the due date (from its first day, before the day it stops) whose lease is in effect then, once per recurring charge and due date, however often it runs or how many run at once: a fee or credit of its own lease, kind and amount. A charge naming a recurring charge is always of its PMC, lease, kind and amount, and recurring charges of other PMCs are never charged."
