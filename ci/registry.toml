[[invariant]]
id = "work-order-steps-in-order"
statement = "A work order's unit is one of its property's; its steps are never dated before it was opened or before the step they follow, nothing follows a completed or cancelled work order, even from two transactions at once, and a bill for a work order is for that property and never for a cancelled one."
