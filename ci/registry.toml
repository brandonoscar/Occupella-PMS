[[invariant]]
id = "recurring-charge-once-per-due-date-while-in-force"
statement = "The rent run charges every recurring charge in force on the due date (from its first day, before the day it stops) whose lease is in effect then, and every one in force on the first day of a lease starting later that month with nothing charged for it in the month yet (due on that day), once per recurring charge and due date, however often it runs or how many run at once: a fee or credit of its own lease and kind, for the days of the month the lease is in effect (its amount x days / days in the month, rounded to the cent; all of it for a whole month). It never reaches back into an earlier month and charges nothing that rounds to 0.00. A charge naming a recurring charge is always of its PMC, lease and kind, at that amount for its due date's month, and recurring charges of other PMCs are never charged."
tests = [
  "tests/properties/test_rent_roll_properties.py::test_rent_roll_invariants_hold_under_random_leases_charges_and_payments",
