[[invariant]]
id = "api-access-is-scoped"
statement = "Only a live session reaches the API, and it acts for its own PMC only: the PMC of every report and of the ledger comes from the session, never the request. Only staff invite, disable logins and download; an owner or a tenant sees only who they are. A request that changes something must be JSON and from the app's own origin."
