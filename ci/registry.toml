[[invariant]]
id = "recurring-bill-enters-each-month-once"
statement = "A recurring bill enters each month's bill from its first day until its end, due on its day of the month, once: running again, or two runs at once, enter no month twice, and a month whose reference the vendor already has is left as it is. Entered bills follow every bill rule (approval limit, set aside, paid)."
