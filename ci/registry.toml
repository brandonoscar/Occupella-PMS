[[invariant]]
id = "owner-contribution-is-not-a-payment"
statement = "An owner's contribution moves the trust bank account's cash into the owner's property account as its own kind, once per request key (the same request returns the original transfer; a different one under the key is refused), and is never matched to a tenant's charge, so it is never rent collected."
