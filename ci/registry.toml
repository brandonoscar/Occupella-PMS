id = "deposit-return"
statement = "The itemized statement of a lease's security deposits once returned, as staff send it to the tenants: the property and unit, the tenants and the lease's days, each tenant's deposit, what was kept for each charge, the totals, what went back to each tenant, and who returned it when. Compared to a checked-in golden file."
tests = [
  "tests/golden/test_golden.py::test_every_golden_case_matches",
  "tests/test_move_out.py::test_a_deposit_pays_what_the_lease_owes_and_the_rest_goes_back",
  "tests/api/test_moveout.py::test_a_move_out_ends_the_lease_charges_damage_and_returns_the_rest",
