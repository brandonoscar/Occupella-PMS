[[invariant]]
id = "exports-hold-the-report"
statement = "Every report exports as CSV, Excel and PDF holding what the report holds: CSV cell for cell, Excel value for value with its types, and no exported cell is ever a spreadsheet formula. Only a trust_report_* function can be exported, under the caller's own role. A PMC's ledger exports whole: every account, transfer and entry, and nothing of another PMC."
