[[invariant]]
id = "nsf-fee-once-per-returned-payment"
statement = "A payment the bank returned charges its lease one NSF fee: the property's fee in force on the day it came back (UTC), due that day, never more than once per returned payment, and none for a fee of 0.00 or without terms. Only postings that move money back to a trust bank account's cash, for a lease of the PMC, count as a returned payment."
