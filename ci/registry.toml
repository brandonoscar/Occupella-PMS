[[invariant]]
id = "credentials-out-of-reach"
statement = "Passwords are kept only as argon2id hashes, and invite and session tokens only as SHA-256 hashes. No hash or secret reaches the audit log, and trust_ai_agent reads no login, invite, session or credential."
tests = [
  "tests/api/test_invites.py::test_staff_invite_an_owner_with_a_link_whose_token_is_kept_only_as_a_hash",
