[[invariant]]
id = "late-fee-once-per-late-rent"
statement = "A rent charge still open at the end of its last day of grace (UTC; its grace starts on its due date, or on the day it was charged if that came later: migration 0151, so a rent charged after its due date has the whole of its grace from that day), counting payments dated before then net of bounces dated before then, and the lease's credits due by its last day of grace, which come off the lease's open charges in the pay order (rent and monthly charges first, then the rest, each oldest first; migration 0093), is charged one late fee: the flat fee plus the percent of what was open, rounded to the cent and capped, under the property's terms in force on the rent's due date. Never more than one per rent, and none for a fee of 0.00. One run charges what a run every day would: it reaches its rents in the order their grace ends, each counting the late fees charged before it as open charges."
tests = [
  "tests/properties/test_rent_roll_properties.py::test_rent_roll_invariants_hold_under_random_leases_charges_and_payments",
