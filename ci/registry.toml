[[invariant]]
id = "recurring-bill-enters-each-month-once"
statement = "A recurring bill enters each month's bill from its first day until its end, due on its day of the month, once: running again, or two runs at once, enter no month twice, and a month whose reference the vendor already has is left as it is. Entered bills follow every bill rule (approval limit, set aside, paid)."
tests = [
  "tests/properties/test_bill_properties.py::test_bill_invariants_hold_under_random_bills_approvals_payments_and_draws",
  "tests/test_recurring_bills.py::test_each_months_bill_is_entered_from_the_first_day_through_the_day_asked",
  "tests/test_recurring_bills.py::test_running_again_enters_only_the_months_not_yet_entered",
  "tests/test_recurring_bills.py::test_a_month_already_entered_by_hand_is_left_as_it_is",
  "tests/test_recurring_bills.py::test_two_runs_at_once_enter_each_month_once",
]

[[invariant]]
id = "exports-hold-the-report"
statement = "Every report exports as CSV, Excel and PDF holding what the report holds: CSV cell for cell, Excel value for value with its types, and no exported cell is ever a spreadsheet formula. Only a trust_report_* function can be exported, under the caller's own role. A PMC's ledger exports whole: every account, transfer and entry, and nothing of another PMC."
tests = [
  "tests/properties/test_export_properties.py::test_csv_holds_every_cell",
  "tests/properties/test_export_properties.py::test_excel_holds_every_value_and_no_formula",
  "tests/properties/test_export_properties.py::test_the_pdf_always_builds",
  "tests/test_exports.py::test_every_report_exports_in_every_format",
  "tests/test_exports.py::test_only_a_report_can_be_named",
  "tests/test_exports.py::test_a_role_without_the_report_is_refused",
  "tests/test_exports.py::test_the_ledger_export_holds_every_account_transfer_and_entry_of_the_pmc",
]

[[invariant]]
id = "api-access-is-scoped"
statement = "Only a live session reaches the API, and it acts for its own PMC only: the PMC of every report and of the ledger comes from the session, never the request. Only staff invite, disable logins and download; an owner or a tenant sees only who they are. A request that changes something must be JSON and from the app's own origin."
tests = [
  "tests/api/test_downloads.py::test_every_report_takes_the_pmc_first",
  "tests/api/test_downloads.py::test_the_report_is_always_the_sessions_pmc",
  "tests/api/test_downloads.py::test_only_staff_download",
  "tests/api/test_invites.py::test_only_staff_invite",
  "tests/api/test_invites.py::test_staff_can_invite_only_their_own_pmcs_people",
  "tests/api/test_invites.py::test_staff_cant_disable_themselves_or_another_pmcs_login",
  "tests/api/test_sign_in.py::test_no_session_and_a_made_up_cookie_are_refused",
  "tests/api/test_sign_in.py::test_a_request_from_another_site_is_refused",
  "tests/api/test_sign_in.py::test_a_change_must_be_sent_as_json",
]

[[invariant]]
id = "credentials-out-of-reach"
statement = "Passwords are kept only as argon2id hashes, and invite and session tokens only as SHA-256 hashes. No hash or secret reaches the audit log, and trust_ai_agent reads no login, invite, session or credential."
tests = [
  "tests/api/test_invites.py::test_staff_invite_an_owner_with_a_link_whose_token_is_kept_only_as_a_hash",
  "tests/api/test_invites.py::test_an_owner_accepts_with_a_password_and_is_signed_in",
  "tests/test_logins.py::test_no_password_hash_reaches_the_audit_log",
  "tests/test_logins.py::test_the_ai_role_reads_no_login_or_credential",
  "tests/test_privileges.py::test_ai_role_reads_only_what_the_app_reads",
]

[[invariant]]
id = "sign-in-refusals"
statement = "A refused sign-in reads the same whatever the reason. Ten failures in a row lock a login for 15 minutes, even against the right password. Staff need an authenticator code, and each code works once. Signing out, a new password or a disabled login ends every session it covers."
tests = [
  "tests/api/test_sign_in.py::test_every_refused_sign_in_reads_the_same",
  "tests/api/test_sign_in.py::test_ten_failures_lock_the_login_even_for_the_right_password",
  "tests/api/test_sign_in.py::test_staff_sign_in_with_a_code_and_each_code_works_once",
  "tests/api/test_sign_in.py::test_signing_out_ends_the_session",
  "tests/api/test_invites.py::test_a_new_invite_resets_the_password_and_ends_old_sessions",
  "tests/api/test_invites.py::test_disabling_a_login_ends_its_sessions_and_sign_ins",
]

[[invariant]]
id = "owner-sees-only-their-own"
statement = "An owner's portal shows the session's owner only: their properties with what each holds now, and their statement (trust_report_owner_statement over whole UTC days). No request names an owner, a property or a PMC, only an owner's session reaches these endpoints, and only staff list the PMC's people."
tests = [
  "tests/api/test_owner.py::test_an_owner_sees_each_of_their_properties_and_what_it_holds",
  "tests/api/test_owner.py::test_the_statement_is_the_owners_report_over_whole_days",
  "tests/api/test_owner.py::test_another_owners_statement_is_never_reachable",
  "tests/api/test_owner.py::test_only_an_owner_reaches_the_owner_endpoints",
  "tests/api/test_people.py::test_only_staff_see_the_people",
]

[[invariant]]
id = "tenant-sees-only-their-own"
statement = "A tenant's portal shows the session's tenant only: the leases they are on with what is due, each lease's ledger (trust_report_tenant_ledger) and the maintenance requests filed under them. A lease they aren't on reads as not found, whoever's it is; the work order and vendor behind a request stay with staff; only a tenant's session reaches these endpoints."
tests = [
  "tests/api/test_tenant.py::test_a_tenant_sees_their_leases_with_what_they_owe",
  "tests/api/test_tenant.py::test_the_ledger_is_the_tenant_ledger_report",
  "tests/api/test_tenant.py::test_a_lease_that_isnt_theirs_reads_as_not_found",
  "tests/api/test_tenant.py::test_a_neighbours_requests_are_never_shown",
  "tests/api/test_tenant.py::test_the_tenant_follows_the_work_order_but_never_sees_its_vendor",
  "tests/api/test_tenant.py::test_only_a_tenant_reaches_the_tenant_endpoints",
]

[[invariant]]
id = "maintenance-requests"
statement = "A maintenance request is filed by a tenant on its lease (a lease in effect today, at most 10 a day through the portal) and never changed. Staff open at most one work order for it, at the lease's unit, and a work order serves one request; the request's status is that work order's latest step."
tests = [
  "tests/test_maintenance_requests.py::test_only_a_tenant_on_the_lease_files_under_it",
  "tests/test_maintenance_requests.py::test_requests_and_their_work_orders_are_never_rewritten",
  "tests/test_maintenance_requests.py::test_a_requests_work_order_is_for_the_leases_unit",
  "tests/test_maintenance_requests.py::test_a_request_has_one_work_order_and_a_work_order_one_request",
  "tests/properties/test_audit_properties.py::test_audit_invariants_hold_under_random_writes_by_random_staff",
  "tests/api/test_tenant.py::test_a_request_is_filed_only_under_a_lease_in_effect",
  "tests/api/test_tenant.py::test_ten_requests_a_day_per_lease",
  "tests/api/test_maintenance.py::test_a_request_gets_one_work_order",
  "tests/api/test_maintenance.py::test_staff_assign_and_complete_and_the_request_closes",
  "tests/api/test_maintenance.py::test_nothing_follows_a_closed_work_order",
]

