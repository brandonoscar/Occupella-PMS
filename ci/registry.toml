[[invariant]]
id = "maintenance-requests"
statement = "A maintenance request is filed by a tenant on its lease (a lease in effect today, at most 10 a day through the portal) and never changed. Staff open at most one work order for it, at the lease's unit, and a work order serves one request; the request's status is that work order's latest step."
