  "tests/test_privileges.py::test_ai_role_reads_only_what_the_app_reads",
]

[[invariant]]
id = "sign-in-refusals"
statement = "A refused sign-in reads the same whatever the reason. Ten failures in a row lock a login for 15 minutes, even against the right password. Staff need an authenticator code, and each code works once. Signing out, a new password or a disabled login ends every session it covers."
