]

[[report]]
id = "owner-balances"
statement = "Owner balances as of the end of a day (UTC): per owner's property its balance, the reserve its agreement keeps back that day, its unpaid bills, and what is available to pay the owner; then the totals. Compared to a checked-in golden file."
tests = [
  "tests/golden/test_golden.py::test_every_golden_case_matches",
  "tests/properties/test_bill_properties.py::test_bill_invariants_hold_under_random_bills_approvals_payments_and_draws",
  "tests/test_owner_balances.py::test_each_property_shows_its_balance_reserve_and_what_is_available",
  "tests/test_owner_balances.py::test_balances_are_as_of_the_end_of_the_day_and_the_reserve_in_force_that_day",
  "tests/properties/test_rent_roll_properties.py::test_rent_roll_invariants_hold_under_random_leases_charges_and_payments",
]

