[[invariant]]
id = "payments-never-overpay"
statement = "A payment is matched to a charge only within both amounts: no charge is paid past its amount, no transfer pays more than it moved, only a payment into the owner's account for the charge's property from cash or a lease tenant's held money counts, and the same match retried returns the original. A charge's paid amount is net of reversals."
tests = [
  "tests/properties/test_rent_roll_properties.py::test_rent_roll_invariants_hold_under_random_leases_charges_and_payments",
  "tests/test_leases_and_charges.py::test_a_charge_is_never_paid_past_its_amount",
