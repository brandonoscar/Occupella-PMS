]

[[invariant]]
id = "lease-documents-and-signatures"
statement = "A lease offer carries the PMC's own lease document, a PDF of at most 5 MB: the PMS writes no lease text. A signature is recorded only for a sent offer and one of its signers, as the e-sign partner reports it. Offers, signers, signature requests, signatures and completions are never rewritten."
tests = [
