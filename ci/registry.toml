[[invariant]]
id = "rent-run-once-per-lease-and-date"
statement = "The rent run charges every lease in effect on the due date (from its first day through its last) its rent for the days of the month it is in effect (monthly rent x days / days in the month, rounded to the cent; the whole rent for a whole month), and every lease starting later that month with no rent charged in the month yet its first part month, due on its first day; once per lease and due date, however often it runs or how many run at once. It never reaches back into an earlier month, charges nothing that rounds to 0.00, and never charges another PMC's lease."
tests = [
  "tests/properties/test_rent_roll_properties.py::test_rent_roll_invariants_hold_under_random_leases_charges_and_payments",
  "tests/test_rent_automation.py::test_only_leases_in_effect_on_the_due_date_are_charged",
  "tests/test_rent_automation.py::test_running_again_charges_nothing_more",
  "tests/test_rent_automation.py::test_two_runs_at_once_charge_each_lease_once",
