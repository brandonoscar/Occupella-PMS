[[invariant]]
id = "roles-decide-who-pays-and-who-approves"
statement = "A staff member the app names pays out money (a bill, an owner draw) only holding the disburse role, approves a reconciliation or signs off a cutover only holding approve, and invites or disables a staff login only holding admin. Only an admin changes a role, a change changes something, and a PMC keeps one admin. Month-end is approved by a staff member other than the one who prepared it, on the figures prepared."
tests = [
  "tests/properties/test_staff_roles_properties.py::test_roles_decide_who_pays_out_and_who_approves",
  "tests/test_staff_roles.py::test_paying_a_bill_takes_a_staff_member_who_may_disburse",
  "tests/test_staff_roles.py::test_whoever_prepared_it_does_not_approve_it",
  "tests/test_staff_roles.py::test_a_pmc_keeps_an_admin",
  "tests/api/test_staff.py::test_paying_out_money_takes_the_disburse_role",
]

[[invariant]]
id = "a-deposit-pays-what-is-owed-and-the-rest-goes-back"
statement = "Once a lease has ended, its tenants' security deposits are returned once (the same request again returns the same; another is refused): what the lease owes, or every deposit if that is less, is kept for the owner's account and matched to its charges oldest first, its cash moving to the owner's trust bank account; the rest goes back to the tenants, kept from in name order. Every deposit is emptied and every trust bank account ties out. A tenant still on another lease keeps their deposit with it, and returning one takes the disburse role."
tests = [
  "tests/properties/test_deposit_return_properties.py::test_a_deposit_return_keeps_what_is_owed_and_gives_back_the_rest",
  "tests/test_move_out.py::test_a_deposit_pays_what_the_lease_owes_and_the_rest_goes_back",
  "tests/test_move_out.py::test_a_tenant_still_on_another_lease_keeps_their_deposit",
  "tests/test_move_out.py::test_the_same_request_again_returns_nothing_twice_and_another_is_refused",
  "tests/api/test_moveout.py::test_a_move_out_ends_the_lease_charges_damage_and_returns_the_rest",
]

[[invariant]]
id = "a-document-is-its-file-and-its-bytes-stay-out-of-the-log"
statement = "A document is a PDF, a JPEG or a PNG of at most 5 MB about one record of its own PMC (a vendor's W-9, a bill's receipt, a lease's move-out photo, an owner's document), and has its file at commit: bytes of the type, size and SHA-256 its row says. Documents and removals are append-only; the bytes are never copied into the audit log and trust_ai_agent never reads them. An owner downloads only their own owner documents."
tests = [
  "tests/test_documents.py::test_a_file_is_the_type_its_document_says",
  "tests/test_documents.py::test_a_file_is_the_size_and_digest_its_document_says",
  "tests/test_documents.py::test_a_document_has_its_file_at_commit",
  "tests/test_documents.py::test_the_log_records_the_document_and_never_its_bytes",
  "tests/test_documents.py::test_the_ai_knows_a_document_exists_and_never_reads_it",
  "tests/api/test_documents_api.py::test_an_owner_reads_their_own_documents_only",
  "tests/properties/test_document_properties.py::test_documents_are_their_files_and_their_bytes_stay_out_of_the_log",
]

