]

[[invariant]]
id = "signing-through-the-partner"
statement = "Offers are signed only through the e-sign partner the server is set up with (none by default; the fake only for trying it out). A tenant reaches only the renewals of their own leases, and gets a signing link only as a signer with their login's email. A tenant sees what the partner reports at once; only staff record it. trust_ai_agent reads no offer, signer, signature request, signature or completion."
tests = [
