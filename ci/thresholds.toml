# Every number in this file is a floor. A PR may raise one, never lower one:
# tools/check_thresholds.py compares this file with the base branch and fails on any decrease.
# A key ending in _max is a ceiling instead: a PR may lower it, never raise it.
# A money function may leave [coverage.money] only when it no longer exists in db/schema.sql.

[coverage]
# Lines changed by a PR (Python and PL/pgSQL) that tests execute, measured by diff-cover.
changed_lines_min = 90.0

[coverage.money]
# The money module: PL/pgSQL functions that move or guard money. Measured with plpgsql_check.
statements_min = 95.0
branches_min = 95.0
functions = [
  "pgledger_create_account",
  "pgledger_check_account_balance_constraints",
  "pgledger_create_transfer",
  "pgledger_create_transfers",
  "trust_refuse_ledger_rewrite",
  "trust_refuse_negative_balance",
  "trust_check_transfer_scope",
  "trust_open_ledger_account",
  "trust_post_transfers",
  "trust_open_vendor_account",
  "trust_check_bank_tie_out",
  "trust_approve_reconciliation",
  "trust_refuse_moving_closed_through",
  "trust_refuse_posting_into_closed_period",
  "trust_check_account_bank_kind",
  "trust_refuse_changing_bank_kind",
  "trust_refuse_overlapping_leases",
  "trust_open_lease",
  "trust_end_lease",
  "trust_apply_payment",
  "trust_reverse_payment",
  "trust_check_agreement_account",
  "trust_lock_owner_account",
  "trust_post_fee",
  "trust_post_management_fee",
  "trust_post_leasing_fee",
  "trust_draw_owner",
  "trust_check_bill_account",
  "trust_lock_bill",
  "trust_set_aside_bill",
  "trust_pay_bill",
  "trust_charge_rent_due",
  "trust_assess_late_fees",
  "trust_refuse_moving_opened_at",
  "trust_post_opening_balances",
  "trust_audit",
  "trust_check_payment_hold",
  "trust_check_hold_release",
  "trust_check_hold_allowance",
  "trust_record_owner_contribution",
  "trust_check_recurring_bill",
  "trust_enter_recurring_bills",
]
# Python money modules (none yet). Each needs the same line and branch floors.
python_paths = []

[coverage.baseline]
# Measured overall coverage, rounded down to 0.1. It only goes up: coverage.yml fails when
# coverage drops below it, and also when coverage rose and this wasn't raised to match.
python_lines = 99.8
sql_statements = 99.8
sql_branches = 99.8

[mutation]
# Share of valid SQL mutants of the money functions that the tests kill (mutation.yml, nightly).
baseline_score = 100.0
# Share of Python mutants (pyproject.toml [tool.mutmut]) a test catches, one no test reaches
# counting as not caught (tools/python_mutation.py). Measured 2026-10-19: 972 of 1,587 (61.2%)
# with the first, narrower test selection; the nightly run says when to raise it.
python_baseline_score = 61.0
# Mutants that can't change behavior, so no test can kill them. Each needs a reason.
equivalent = [
  # Postgres grants PUBLIC no table privileges by default: revoking them again is a no-op.
  "20261009000002_ledger_append_only.sql: delete `REVOKE ALL ON`",
  "20261009000003_trust_model.sql: delete `REVOKE ALL ON`",
  "20261009000004_idempotency_keys.sql: delete `REVOKE ALL ON trust_idempotency_keys FROM PUBLIC;`",
  "20261009000005_trust_account_tie_out.sql: delete `REVOKE ALL ON trust_vendors FROM PUBLIC;`",
  "20261009000006_reconciliations.sql: delete `REVOKE ALL ON trust_reconciliations FROM PUBLIC;`",
  "20261010000012_leases_and_charges.sql: delete `REVOKE ALL ON trust_units, trust_leases, trust_lease_tenants`",
  "20261010000014_payment_reversals.sql: delete `REVOKE ALL ON trust_payment_reversals FROM PUBLIC;`",
  "20261010000016_owner_money.sql: delete `REVOKE ALL ON`",
  "20261010000017_vendor_bills.sql: delete `REVOKE ALL ON trust_bills, trust_bill_approvals, trust_bill_`",
  "20261010000018_work_orders.sql: delete `REVOKE ALL ON trust_work_orders, trust_work_order_steps FROM`",
  "20261010000019_rent_automation.sql: delete `REVOKE ALL ON trust_late_fee_policies, trust_late_fees FROM `",
  "20261010000022_cutover.sql: delete `REVOKE ALL ON trust_opening_balances FROM PUBLIC;`",
  "20261010000024_audit_log.sql: delete `REVOKE ALL ON trust_staff FROM PUBLIC;`",
  "20261010000024_audit_log.sql: delete `REVOKE ALL ON trust_audit_log FROM PUBLIC;`",
  "20261010000025_payment_holds.sql: delete `REVOKE ALL ON trust_payment_holds, trust_payment_hold_releas`",
  "20261010000026_owner_contributions.sql: delete `REVOKE ALL ON trust_owner_contributions FROM PUBLIC;`",
  "20261010000027_recurring_bills_and_vendor_payments.sql: delete `REVOKE ALL ON trust_recurring_bills, trust_recurring_bill_en`",
  "20261011000028_logins.sql: delete `REVOKE ALL ON trust_logins, trust_invites, trust_sessions, t`",
  "20261011000029_maintenance_requests.sql: delete `REVOKE ALL ON trust_maintenance_requests, trust_maintenance_`",
  "20261011000030_rental_applications.sql: delete `REVOKE ALL ON trust_application_links, trust_application_lin`",
  "20261011000031_lease_offers.sql: delete `REVOKE ALL ON trust_lease_offers, trust_lease_offer_signers,`",
  # trust_check_bank_tie_out sums one trust bank account. With `<>` in the join or the filter,
  # it sums (1 or n) x every balance in the database, minus this bank's: double entry keeps
  # every balance in the database summing to zero, so the result is zero exactly when the
  # bank's own sum is, and the check behaves the same. This file's other two `= to <>`
  # mutants are invalid SQL. Committed migrations never change, so this key can't match new
  # code.
  "20261009000005_trust_account_tie_out.sql: = to <>",
  # trust_app was never granted INSERT/UPDATE/DELETE/TRUNCATE on these tables.
  "20261009000002_ledger_append_only.sql: delete `REVOKE INSERT, UPDATE, DELETE, TRUNCATE ON`",
  # 20261009000007 revokes this grant of pgledger's posting functions from trust_app, so the
  # database ends up the same with it or without it.
  "20261009000002_ledger_append_only.sql: delete `GRANT EXECUTE ON FUNCTION`",
]

[properties]
# Hypothesis examples per property test.
pr_examples = 200
nightly_examples = 3000
steps_per_example = 40

[fuzz]
# Generated requests per API operation (Schemathesis, tests/api/test_api_fuzz.py), on top of
# the schema's own boundary cases: every PR, and nightly (HYPOTHESIS_PROFILE=nightly).
pr_examples = 3
nightly_examples = 100

[email]
# Mailpit's HTML check of the HTML part of an email (tests/test_email_mailpit.py): the share,
# in percent, of what it uses that mail programs support (caniemail.com's data, in Mailpit).
html_check_supported_min = 90.0

[speed]
# The nightly speed test (tools/speed.py): ten staff at once on a 1,000-unit company, pausing
# about a second between pages. Each is a ceiling on a 95th percentile in milliseconds: a PR may
# lower one, never raise one. Measured 2026-10-21 (4 cores): pages at most 728 ms, PDFs 1,539 ms.
page_p95_ms_max = 1000
download_p95_ms_max = 10000
