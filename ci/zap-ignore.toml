# ZAP rules whose alerts are no risk here (tools/zap_alerts.py, zap.yml). Every alert of low risk
# or higher fails the scan unless its rule is here, each with why. A new entry needs a reason a
# reviewer can check against the code; never add one to get green.
#
# [[ignore]]
# rule = "10000"
# reason = "why this alert is no risk in this app"

[[ignore]]
rule = "10116"
reason = "ZAP is Out of Date: about the scanner, not the PMS. zap.yml pins ZAP's image (ZAP_IMAGE) by version and digest so a run is repeatable, and the pinned version's rules still run in full; a newer ZAP is taken by changing that pin in a PR of its own."
